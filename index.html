<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Chess Learning App</title>
<!--
  ============================================================================
  CHESS LEARNING APP — single-file build
  ----------------------------------------------------------------------------
  SECTIONS:
    1. CSS (pastel theme, iPad-friendly touch targets)
    2. HTML screens (family gate, profiles, home, lesson, quiz, puzzles,
       play vs computer, live games, parent dashboard)
    3. JS:
       A. FIREBASE_CONFIG (<<< GROWN-UP: FILL THIS IN >>>)
       B. Firebase init + anonymous auth + family-code gate
       C. Profiles (per-device remember-me)
       D. Curriculum data (12 lessons) + lesson player
       E. Quiz engine
       F. Puzzle trainer (adaptive ladder)
       G. Chess board renderer (tap-to-move, chess.js rules)
       H. Computer AI (alpha-beta minimax, levels 1-5)
       I. Live cross-iPad games + pass-and-play
       J. Parent dashboard (PIN-gated)
       K. Coaching directives from Stella + activity log
       L. Rewards (stars, badges, streaks, confetti) + boot
  ============================================================================
-->
<style>
/* ============================ 1. CSS ================================== */
:root{
  --cream:#FFF9F1; --peach:#FFE3C9; --mint:#D3EEDC; --lavender:#E2D8F7;
  --sky:#CFE8FA; --butter:#FFEBA8; --rose:#FFD9E0; --coral:#FFB59E; --grape:#DCD0F7;
  --ink:#4A4458; --ink-soft:#7A7390; --white:#FFFFFF;
  --sq-light:#F6E7C8; --sq-dark:#D9A97E;
  --shadow:0 6px 18px rgba(120,100,140,.14);
  --radius:22px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--cream); color:var(--ink);
  min-height:100vh; min-height:100dvh;
  touch-action:manipulation; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
}
#app{max-width:980px;margin:0 auto;padding:16px 16px 48px;}
.screen{display:none;animation:fadeIn .25s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
h1{font-size:32px;margin:12px 0;} h2{font-size:24px;margin:10px 0;} h3{font-size:19px;margin:8px 0;}
p{font-size:17px;line-height:1.55;color:var(--ink);}
.muted{color:var(--ink-soft);} .center{text-align:center;}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin:14px 0;}
.card.peach{background:var(--peach);} .card.mint{background:var(--mint);}
.card.lavender{background:var(--lavender);} .card.sky{background:var(--sky);}
.card.butter{background:var(--butter);} .card.rose{background:var(--rose);} .card.grape{background:var(--grape);}
.btn{
  display:inline-block;border:none;cursor:pointer;font-weight:700;color:var(--ink);
  font-size:19px;padding:16px 26px;border-radius:18px;margin:8px 6px 8px 0;
  background:var(--butter);box-shadow:0 4px 0 rgba(0,0,0,.08);min-height:56px;min-width:44px;
  transition:transform .08s ease;
}
.btn:active{transform:scale(.96);}
.btn.primary{background:#FFC98B;} .btn.mint{background:var(--mint);}
.btn.sky{background:var(--sky);} .btn.lavender{background:var(--lavender);}
.btn.rose{background:var(--rose);} .btn.ghost{background:#F1EDE6;}
.btn.big{font-size:22px;padding:20px 34px;width:100%;margin:10px 0;}
.btn:disabled{opacity:.45;cursor:default;}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.backbtn{border:none;background:var(--white);box-shadow:var(--shadow);border-radius:14px;
  font-size:20px;font-weight:700;color:var(--ink);min-width:52px;min-height:52px;cursor:pointer;}
.backbtn:active{transform:scale(.94);}
.profile-chip{margin-left:auto;background:var(--white);border-radius:999px;padding:8px 16px;
  box-shadow:var(--shadow);font-weight:700;display:flex;align-items:center;gap:8px;min-height:52px;}
.avatar{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:#fff;flex:none;}
/* lesson path */
.lesson-row{display:flex;align-items:center;gap:14px;background:var(--white);border-radius:18px;
  box-shadow:var(--shadow);padding:14px 16px;margin:10px 0;cursor:pointer;min-height:76px;}
.lesson-row:active{transform:scale(.98);}
.lesson-row.locked{opacity:.5;cursor:default;}
.lesson-num{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;background:var(--lavender);color:var(--ink);}
.lesson-row.done .lesson-num{background:var(--mint);}
.lesson-info{flex:1;} .lesson-info .t{font-weight:800;font-size:18px;} .lesson-info .s{color:var(--ink-soft);font-size:14px;}
.stars{color:#E8A93D;font-size:20px;letter-spacing:2px;}
/* chess board */
.board-wrap{display:flex;justify-content:center;margin:12px 0;}
.board{display:grid;grid-template-columns:repeat(8,1fr);width:min(92vw,560px);aspect-ratio:1/1;
  border-radius:14px;overflow:hidden;box-shadow:0 12px 28px rgba(80,50,20,.35),inset 0 0 0 2px rgba(255,255,255,.18);border:6px solid #8a5a33;position:relative;}
.square{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;aspect-ratio:1/1;}
.square.light{background:linear-gradient(145deg,#f8ecd2 0%,#eedcab 100%);}
.square.dark{background:linear-gradient(145deg,#c08a5a 0%,#a26e42 100%);}
.pcsvg{width:92%;height:92%;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
.square.sel{outline:4px solid #7FB6F5;outline-offset:-4px;}
.square.lastmove::after{content:"";position:absolute;inset:0;background:rgba(255,235,140,.55);pointer-events:none;}
.square.incheck::after{content:"";position:absolute;inset:0;background:rgba(255,110,110,.55);pointer-events:none;}
.square .dot{position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(90,140,90,.5);pointer-events:none;}
.square .cap-ring{position:absolute;inset:6%;border-radius:50%;border:5px solid rgba(90,140,90,.55);pointer-events:none;}
.square .coord{position:absolute;font-size:11px;font-weight:700;opacity:.65;pointer-events:none;}
.coord.rank{top:2px;left:4px;} .coord.file{bottom:2px;right:5px;}
.square.light .coord{color:#a07c4f;} .square.dark .coord{color:#f6e7c8;}
.piece-ghost{position:absolute;z-index:5;pointer-events:none;transition:transform .55s ease-in-out;}
.iconbtn{background:var(--white);border:2px solid var(--peach);border-radius:50%;width:44px;height:44px;
  font-size:20px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;}
.tray{display:flex;flex-wrap:wrap;gap:2px;min-height:34px;align-items:center;font-size:24px;margin:6px 0;}
.movelist{background:#FBF7EF;border-radius:14px;padding:10px 14px;max-height:150px;overflow-y:auto;font-size:15px;margin:8px 0;}
.movelist table{width:100%;border-collapse:collapse;} .movelist td{padding:3px 6px;}
/* quiz */
.choice{display:block;width:100%;text-align:left;background:var(--white);border:3px solid transparent;
  border-radius:16px;padding:16px;font-size:18px;font-weight:600;color:var(--ink);margin:10px 0;cursor:pointer;min-height:60px;}
.choice:active{transform:scale(.98);}
.choice.correct{border-color:#6FCF97;background:#E9F9EF;}
.choice.wrong{border-color:#F19999;background:#FDECEC;}
.feedback{border-radius:16px;padding:16px;font-size:17px;margin:12px 0;font-weight:600;}
.feedback.good{background:var(--mint);} .feedback.try{background:var(--peach);}
/* misc */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:640px){.grid2{grid-template-columns:1fr;}}
.badge{display:inline-block;background:var(--lavender);border-radius:999px;padding:8px 16px;margin:4px;font-weight:700;font-size:15px;}
.badge.gold{background:var(--butter);}
.streak{display:inline-flex;align-items:center;gap:6px;background:#FFE9D6;border-radius:999px;padding:8px 16px;font-weight:800;}
input[type=text],input[type=number],input[type=tel]{font-size:20px;padding:16px;border-radius:16px;border:3px solid #E7DFD2;
  width:100%;margin:8px 0;background:#fff;color:var(--ink);font-family:inherit;}
input:focus{outline:none;border-color:#B79CED;}
.code-big{font-size:40px;font-weight:800;letter-spacing:10px;background:var(--white);border-radius:18px;
  padding:18px;text-align:center;box-shadow:var(--shadow);margin:14px 0;font-family:ui-monospace,monospace;}
.pinrow{display:flex;gap:10px;justify-content:center;}
.pinrow input{width:64px;text-align:center;font-size:28px;}
table.stats{width:100%;border-collapse:collapse;font-size:16px;}
table.stats td,table.stats th{padding:10px 8px;border-bottom:2px solid #F1EAE0;text-align:left;}
table.stats th{color:var(--ink-soft);}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:14px 24px;border-radius:999px;font-weight:700;font-size:17px;opacity:0;transition:all .3s;z-index:99;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:98;overflow:hidden;}
.confetti-piece{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
.coach-card{background:linear-gradient(135deg,var(--lavender),var(--sky));border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin:14px 0;}
.coach-card .who{font-weight:800;font-size:17px;margin-bottom:6px;}
.progressbar{height:14px;background:#EFE7D8;border-radius:999px;overflow:hidden;margin:8px 0;}
.progressbar>div{height:100%;background:linear-gradient(90deg,#FFC98B,#FF9E7D);border-radius:999px;transition:width .4s;}
.diff-pick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.diff-btn{border:3px solid transparent;background:var(--white);border-radius:14px;padding:12px 14px;font-weight:700;
  cursor:pointer;min-height:56px;box-shadow:var(--shadow);font-size:15px;}
.diff-btn.sel{border-color:#B79CED;background:var(--lavender);}
.lobby-code{font-size:52px;font-weight:800;letter-spacing:8px;text-align:center;background:var(--butter);
  border-radius:18px;padding:16px;margin:12px 0;}
.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
.tab{border:none;background:#F1EDE6;border-radius:999px;padding:12px 20px;font-weight:700;font-size:16px;cursor:pointer;min-height:48px;}
.tab.sel{background:var(--ink);color:#fff;}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px solid #F4EEE2;font-size:16px;}
.kv b{font-size:17px;}
.hint-box{background:var(--sky);border-radius:14px;padding:14px 16px;margin:10px 0;font-size:16px;}
.big-emoji{font-size:54px;}
.promo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0;}
.promo-grid button{font-size:44px;background:var(--white);border:3px solid #E7DFD2;border-radius:16px;padding:10px;cursor:pointer;min-height:76px;}
</style>
</head>

const $ = (sel, el) => (el||document).querySelector(sel);
const $$ = (sel, el) => Array.from((el||document).querySelectorAll(sel));

function toast(msg, ms){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), ms||2600);
}
function rnd(n){ const c="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function rid(n){ const c="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"; let s=""; for(let i=0;i<(n||24);i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function hashPin(pin){ let h=0; for(let i=0;i<pin.length;i++){ h=((h<<5)-h+pin.charCodeAt(i))|0; } return "p"+(h>>>0).toString(36); }
function confetti(n){
  const box = $("#confetti"); const colors=["#FFB59E","#BFE3C6","#DCCFF5","#A9D3F2","#FFE9A8","#FFC9D6"];
  for(let i=0;i<(n||80);i++){
    const d=document.createElement("div"); d.className="confetti-piece";
    d.style.left=Math.random()*100+"vw"; d.style.background=colors[i%colors.length];
    d.style.animationDuration=(2.2+Math.random()*2.2)+"s"; d.style.animationDelay=(Math.random()*0.6)+"s";
    d.style.transform="rotate("+Math.random()*360+"deg)";
    box.appendChild(d); setTimeout(()=>d.remove(),5200);
  }
}
const PRAISE = ["Brilliant!","Amazing thinking!","You did it!","Superstar move!","Wow, well played!","Clever, clever!","Champion thinking!"];

function praise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }
function tryAgain(){ return TRYAGAIN[Math.floor(Math.random()*TRYAGAIN.length)]; }
function avatarHTML(p, size){
  const initial = esc((p.name||"?").trim().charAt(0).toUpperCase());

/* ============================ VOICE (story narration) ============================
   Reads lesson steps aloud using the iPad's own voices (including Siri voices
   on iPadOS 16+). Toggle in the topbar; choice remembered per device. */
const LS_VOICE="cla_voice_on";
let VOICE_ON=true;
try{ VOICE_ON = localStorage.getItem(LS_VOICE)!=="0"; }catch(e){}
let VOICE_PICKED=null;
function pickVoice(){
  try{
    const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    if(!vs.length) return null;
    const en=vs.filter(v=>/^en([-_]|$)/i.test(v.lang||""));
    const pool=en.length?en:vs;
    return pool.find(v=>/siri/i.test(v.name))||pool.find(v=>/natural|neural|premium|enhanced/i.test(v.name))||pool[0]||null;
  }catch(e){ return null; }
}
function cleanSpeech(t){
  return (t||"").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu,"").replace(/\s+/g," ").trim();
}
function speak(text){
  stopSpeak();
  text=cleanSpeech(text);
  if(!VOICE_ON||!text) return;
  try{
    if(!("speechSynthesis" in window)) return;
    if(!VOICE_PICKED) VOICE_PICKED=pickVoice();
    const u=new SpeechSynthesisUtterance(text);
    if(VOICE_PICKED) u.voice=VOICE_PICKED;
    u.rate=0.95; u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeak(){ try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} }
function speakWait(text){
  return new Promise(res=>{
    stopSpeak();
    text=cleanSpeech(text);
    if(!VOICE_ON||!text){ res(); return; }
    (async()=>{
      try{
        if(!("speechSynthesis" in window)){ res(); return; }
        await wait(120);
        if(!VOICE_PICKED) VOICE_PICKED=pickVoice();
        const u=new SpeechSynthesisUtterance(text);
        if(VOICE_PICKED) u.voice=VOICE_PICKED;
        u.rate=0.95; u.pitch=1.05;
        let done=false;
        const fin=()=>{ if(!done){ done=true; res(); } };
        u.onend=fin; u.onerror=fin;
        setTimeout(fin,15000);
        speechSynthesis.speak(u);
      }catch(e){ res(); }
    })();
  });
}
function toggleVoice(){
  VOICE_ON=!VOICE_ON;
  try{ localStorage.setItem(LS_VOICE, VOICE_ON?"1":"0"); }catch(e){}
  if(!VOICE_ON) stopSpeak();
  const b=document.getElementById("voicebtn"); if(b) b.textContent=VOICE_ON?"🔊":"🔇";
}
try{ if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged=function(){ VOICE_PICKED=null; }; } }catch(e){}
function render(screen, arg){
  stopSpeak();
  LIVE_UNSUBS.forEach(u=>{try{u();}catch(e){}}); LIVE_UNSUBS=[];
  window.scrollTo(0,0);
  ({gate:renderGate, profiles:renderProfiles, home:renderHome, lesson:renderLesson,
    quiz:renderQuiz, puzzles:renderPuzzles, play:renderPlay, live:renderLiveLobby,
    livegame:renderLiveGameSafe, playgame:renderPlayGameSafe, passplay:renderPassPlaySafe,
    parent:renderParent}[screen]||renderGate)(arg);
}

/* ---- coaching directives (written by Stella) ---- */
async function loadCoaching(){
  COACH = [];
  try{
    const v = await dbGet(`coaching/${PROFILE.id}/directives`);
    if(v) COACH = Object.entries(v).map(([id,d])=>Object.assign({id},d)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  }catch(e){}
  // apply latest difficulty directive as a recommendation
  const diff = COACH.find(c=>c.kind==="difficulty" && !c.acknowledgedAt);
  PROFILE._coachAI = diff && diff.detail && diff.detail.aiLevel ? Math.max(1,Math.min(5,diff.detail.aiLevel)) : null;
  PROFILE._coachFocus = (COACH.find(c=>c.kind==="focus" && !c.acknowledgedAt)||{}).text || null;
}

  try{ await dbUpdate(`coaching/${PROFILE.id}/directives/${id}`, {acknowledgedAt:Date.now()}); }catch(e){}
  COACH = COACH.filter(c=>c.id!==id);

}
async function touchStreak(silent){
  try{
    const s = (await dbGet(`progress/${PROFILE.id}/streak`)) || {count:0,lastDay:""};
    const t = todayStr();
    if(s.lastDay !== t){
      const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
      s.count = (s.lastDay===y) ? (s.count||0)+1 : 1;
      s.lastDay = t;
      await dbSet(`progress/${PROFILE.id}/streak`, s);
      if(!silent && s.count>1) setTimeout(()=>toast(`🔥 ${s.count}-day streak! Keep it up!`), 800);
    }
    PROFILE._streak = s.count||1;
  }catch(e){ PROFILE._streak = 1; }
}

    {q:"Where are rooks happiest?", choices:["In corners","On open files","Next to the king","Off the board"], answer:1, explain:"Open files — long empty lines to zoom along!"},
  ]},
{ id:"knight", title:"Knights", sub:"The tricky jumpers",

    {t:"say", text:"The KNIGHT ♞ is the trickiest piece in chess! It jumps in an L shape — and it can JUMP OVER other pieces!"},
    {t:"board", fen:"8/8/8/8/3N4/8/8/4K2k w - - 0 1", hl:["c6","e6","f5","f3","e2","c2","b3","b5"], text:"Two squares one way, then one square sideways — that's the L! Count the glowing squares: a knight in the middle attacks 8 squares!"},
    {t:"move", prompt:"Jump the knight to a glowing square!", fen:"8/8/8/8/3N4/8/8/4K2k w - - 0 1", from:"d4", targets:["e6","f5","c6","b5"], after:"Boing! Knights are the only piece that jumps over others."},
    {t:"say", text:"Knight tip: knights are strongest in the CENTER. A knight on the rim is dim — “a knight on the rim is grim”!"},
  ],
  quiz:[
    {q:"How does a knight move?", choices:["Straight lines","Diagonally","An L shape, jumping","One square"], answer:2, explain:"L shape — and it jumps over pieces!"},
    {q:"Can a knight jump over other pieces?", choices:["Yes!","No","Only pawns","Only backwards"], answer:0, explain:"Yes! The knight is the only jumper."},
    {q:"Where is a knight strongest?", choices:["In the corner","On the rim","In the center","Off the board"], answer:2, explain:"Center knights attack 8 squares!"},
  ]},
{ id:"bishop", title:"Bishops", sub:"The diagonal dashers",
  steps:[
    {t:"say", text:"The BISHOP ♝ glides on diagonals — and it NEVER leaves its color! You start with one light-squared and one dark-squared bishop."},
    {t:"board", fen:"8/8/8/8/3B4/8/8/4K2k w - - 0 1", hl:["a1","b2","c3","e5","f6","g7","h8","c5","b6","a7","e3","f2","g1"], text:"Diagonals only, as far as it wants! This bishop lives on dark squares and will never touch a light one."},
    {t:"move", prompt:"Glide the bishop to a glowing square!", fen:"8/8/8/8/3B4/8/8/4K2k w - - 0 1", from:"d4", targets:["h8","a1","g7","a7"], after:"Whoosh! Bishops are long-range snipers."},
    {t:"say", text:"Two bishops together are called “the bishop pair” — they cover every color and are super strong in open positions!"},
  ],
  quiz:[
    {q:"How does a bishop move?", choices:["Straight","Diagonally","L shape","One square"], answer:1, explain:"Diagonals, any distance!"},
    {q:"Can a bishop ever change square color?", choices:["Yes","No, never","After 10 moves","If it captures"], answer:1, explain:"Never! A dark-squared bishop stays dark forever."},
    {q:"How many points is a bishop worth?", choices:["1","3","5","9"], answer:1, explain:"3 points — same as a knight."},
  ]},
{ id:"queen", title:"Queens", sub:"The superstar",
  steps:[
    {t:"say", text:"The QUEEN ♛ is the superstar — worth 9 points! She moves like a rook AND a bishop combined!"},
    {t:"board", fen:"8/8/8/8/3Q4/8/8/4K2k w - - 0 1", hl:["d8","d1","a4","h4","h8","a1","g7","a7","g1"], text:"Straight lines AND diagonals! The queen is the most powerful piece — which is why you must keep her safe."},
    {t:"move", prompt:"Move the queen anywhere glowing!", fen:"8/8/8/8/3Q4/8/8/4K2k w - - 0 1", from:"d4", targets:["d8","h4","h8","a4"], after:"The queen goes wherever she pleases!"},
    {t:"say", text:"Queen tip: don't bring her out too early! If she wanders out alone, enemy pieces will chase her while developing. Develop knights and bishops first!"},
  ],
  quiz:[
    {q:"How does the queen move?", choices:["Like a rook only","Like a bishop only","Like a rook AND bishop","Like a knight"], answer:2, explain:"Both! Straight lines and diagonals."},
    {q:"How many points is the queen worth?", choices:["5","9","3","10"], answer:1, explain:"9 points — the most valuable piece!"},
    {q:"When should the queen come out?", choices:["First move!","After knights & bishops develop","Never","Only to capture"], answer:1, explain:"Develop minor pieces first, then Her Majesty."},
  ]},
{ id:"king", title:"Kings", sub:"Protect the crown!",
  steps:[
    {t:"say", text:"The KING ♚ is the most IMPORTANT piece — but not the strongest. He waddles one square in any direction."},
    {t:"board", fen:"8/8/8/8/8/8/8/3K4 w - - 0 1", hl:["c1","e1","c2","d2","e2"], text:"One square only — but in EVERY direction! The whole game is about keeping him safe."},
    {t:"move", prompt:"Move the king to safety!", fen:"8/8/8/8/8/8/8/3K4 w - - 0 1", from:"d1", targets:["c1","e1","c2","d2","e2"], after:"Slow and steady! The king is precious cargo."},
    {t:"say", text:"Golden rule: NEVER move your king where he could be captured! And in the endgame, when few pieces remain, the king becomes a brave fighter!"},
  ],
  quiz:[
    {q:"How does the king move?", choices:["Any distance","One square any direction","L shape","Two squares"], answer:1, explain:"One square in any direction."},
    {q:"What happens if your king is captured?", choices:["You lose a turn","The game ends — you lose","Nothing","You get a new king"], answer:1, explain:"Actually the game ends one step earlier — at checkmate, when the king CAN'T escape capture!"},
    {q:"In the endgame the king should…", choices:["Hide forever","Become active and fight","Stay in the corner","Be sacrificed"], answer:1, explain:"With few pieces left, the king is a strong fighter!"},
  ]},
{ id:"setup", title:"Setup & Special Moves", sub:"Castling, promotion & en passant",
  steps:[
    {t:"say", text:"Time to set up a real battle! Back rank: rooks in the corners, then knights, then bishops — queen on HER color, king next to her. Pawns all across in front!"},
    {t:"board", fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", text:"“Queen on her color” — white queen starts on a light square, black queen on dark. White always moves first!"},
    {t:"say", text:"Special move #1: CASTLING! If neither the king nor a rook has moved, no pieces between them, and the king isn't in check — the king hops two squares toward the rook, and the rook jumps over! It tucks your king to safety in ONE move."},
    {t:"move", prompt:"Castle kingside! Move the king two squares.", fen:"r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1", from:"e1", targets:["g1"], after:"Castled! King safe, rook developed — two birds, one move!"},
    {t:"say", text:"Special move #2: EN PASSANT (French for “in passing”). If an enemy pawn jumps two squares and lands BESIDE your pawn, you may capture it as if it moved only one! You must do it immediately — or the chance is gone!"},
    {t:"move", prompt:"Capture en passant!", fen:"8/8/8/3Pp3/8/8/8/4K2k w - e6 0 1", from:"d5", targets:["e6"], after:"En passant! The sneakiest rule in chess — now YOU know it!"},
  ],
  quiz:[
    {q:"In the starting position, the white queen goes on…", choices:["A dark square","A light square","Any square","e1"], answer:1, explain:"Queen on her color — white queen on light d1!"},
    {q:"What is castling?", choices:["King moves 2, rook jumps over","Queen swap","Pawn jump","Resigning"], answer:0, explain:"King hops two toward the rook; rook jumps over. Safety + development!"},
    {q:"When can you play en passant?", choices:["Anytime","Only on the move right after the pawn jumps","Only in the endgame","Never"], answer:1, explain:"Immediately or never — use it or lose it!"},
  ]},
{ id:"check", title:"Check, Mate & Stalemate", sub:"How games are won",
  steps:[
    {t:"say", text:"CHECK means your king is attacked! You MUST get out of check — move the king, block the attack, or capture the attacker."},
    {t:"board", fen:"7k/8/8/8/8/8/8/R6K w - - 0 1", hl:["a8"], text:"See? Our rook is giving check! The black king must run. If there's NO escape — that's CHECKMATE, and the game is over!"},
    {t:"move", prompt:"Deliver checkmate! (Ra8#)", fen:"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1", from:"a1", targets:["a8"], after:"CHECKMATE!! The king has nowhere to run. You win! 🏆"},
    {t:"say", text:"Careful: STALEMATE is a trap! If it's your turn and you have NO legal moves but are NOT in check — it's a DRAW, even if you're winning! Always leave your opponent a move!"},
    {t:"board", fen:"7k/8/6Q1/8/8/8/8/6K1 b - - 0 1", text:"Look: black to move, not in check, but the king can't move anywhere. STALEMATE — draw! Champions never stalemate a won game."},
  ],
  quiz:[
    {q:"What must you do when in check?", choices:["Ignore it","Get out of check","Resign","Move any piece"], answer:1, explain:"Move the king, block, or capture — you must answer check!"},
    {q:"What is checkmate?", choices:["The king is in check with no escape","A draw","Capturing the queen","50 moves"], answer:0, explain:"Check + no escape = checkmate = you win!"},
    {q:"What is stalemate?", choices:["A win","No legal moves, not in check — a draw","Checkmate in 1","Losing on time"], answer:1, explain:"Stalemate = draw. Don't accidentally draw a won game!"},
  ]},
{ id:"tactics", title:"Tactics: Pins & Forks", sub:"Winning material like a wizard",
  steps:[
    {t:"say", text:"TACTICS are short tricks that win pieces! The two most common: PINS and FORKS. Learn these and you'll win so many games!"},
    {t:"board", fen:"4k3/8/8/8/4r3/8/8/4R1K1 w - - 0 1", hl:["e4"], text:"A PIN: the black rook on e4 CAN'T move — it's pinned to its king by our rook! Pinned pieces are sitting ducks."},
    {t:"tap", prompt:"Tap the pinned piece!", fen:"4k3/8/8/8/4r3/8/8/4R1K1 w - - 0 1", targets:["e4"], after:"Yes! Absolute pin — moving it would expose the king, which is illegal!"},
    {t:"board", fen:"2r1k3/8/3N4/8/8/8/8/4K3 w - - 0 1", hl:["e8","c8"], text:"A FORK: our knight attacks TWO pieces at once — the king AND the rook! One moves, the other falls. Knights are fork wizards!"},
    {t:"tap", prompt:"Tap both forked pieces!", fen:"2r1k3/8/3N4/8/8/8/8/4K3 w - - 0 1", targets:["e8","c8"], after:"Forked! When one piece attacks two, you win material!"},
  ],
  quiz:[
    {q:"What is a pin?", choices:["A piece that can't move without exposing something valuable","A fast move","A draw","A promotion"], answer:0, explain:"Pinned pieces are stuck defending!"},
    {q:"What is a fork?", choices:["Eating with a fork","One piece attacking two at once","Castling","A draw"], answer:1, explain:"One attacker, two targets — you win one of them!"},
    {q:"Which piece is the most famous forker?", choices:["Pawn","Knight","King","Bishop"], answer:1, explain:"Knights fork in every direction!"},
  ]},
{ id:"openings", title:"Opening Principles", sub:"Start like a champion",
  steps:[
    {t:"say", text:"The OPENING is the first 10 moves. Champions follow 4 golden rules — learn them and you'll never be lost!"},
    {t:"say", text:"Rule 1: CONTROL THE CENTER — play e4 or d4! Rule 2: DEVELOP knights and bishops toward the center!"},
    {t:"say", text:"Rule 3: CASTLE EARLY to keep your king safe! Rule 4: DON'T move the same piece twice or bring the queen out too soon!"},
    {t:"move", prompt:"Play the champion's first move: e4!", fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", from:"e2", targets:["e4"], after:"e4! You control the center AND open lines for your queen and bishop!"},
    {t:"board", fen:"rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2", text:"After 1.e4 e5 2.Nf3 — perfect! Pawn to center, knight developed toward the center, ready to castle. That's opening gold!"},
  ],
  quiz:[
    {q:"What's the #1 opening rule?", choices:["Move the queen first","Control the center","Castle on move 1","Push all pawns"], answer:1, explain:"Center pawns first — e4 or d4!"},
    {q:"Which pieces develop first?", choices:["Queen","Knights and bishops","Rooks","King"], answer:1, explain:"Knights and bishops toward the center!"},
    {q:"Why castle early?", choices:["It looks cool","King safety + rook development","To attack","It's required"], answer:1, explain:"Safety first, champions!"},
  ]},
{ id:"endgame", title:"Basic Endgames", sub:"Finishing like a pro",
  steps:[
    {t:"say", text:"The ENDGAME: few pieces left. Now your KING becomes a brave fighter, and technique wins!"},
    {t:"say", text:"King + Queen vs lone King is a guaranteed win. The method: 1) Use your queen to shrink the king's “box”, 2) bring your king close, 3) deliver checkmate!"},
    {t:"board", fen:"k7/8/1QK5/8/8/8/8/8 w - - 0 1", hl:["b7"], text:"Watch the finish: our queen goes to b7 — CHECKMATE! The black king is trapped by our king and queen working together!"},
    {t:"move", prompt:"Deliver the checkmate: Qb7#", fen:"k7/8/1QK5/8/8/8/8/8 w - - 0 1", from:"b6", targets:["b7"], after:"MATE! Queen and king, side by side — unstoppable! 🏆"},
    {t:"say", text:"Endgame golden rules: activate your king, push passed pawns, and never stalemate a won position! You're officially tournament-ready material!"},
  ],
  quiz:[
    {q:"In the endgame, your king should…", choices:["Keep hiding","March up and fight","Stay home","Be traded"], answer:1, explain:"The king becomes a powerful fighter!"},

    {q:"What must you avoid in a winning endgame?", choices:["Checkmate","Stalemate","Captures","Checks"], answer:1, explain:"Stalemate draws — always give them a legal move until mate!"},
  ]},
{ id:"tactics2", title:"Trickier Tactics", sub:"Skewers, discovered attacks & double checks",
  steps:[
    {t:"say", text:"You already know pins and forks — sneaky ways to win pieces! Now meet their trickier cousins: the SKEWER, the DISCOVERED ATTACK, and the DOUBLE CHECK. Watch them in action! 🎬"},
    {t:"demo", fen:"8/8/8/5q2/4k3/8/8/1B4K1 w - - 0 1", text:"The SKEWER: attack the king, and win the piece hiding behind it! Watch our bishop.",

      {from:"b1",to:"c2",text:"Bishop to c2 — CHECK! The black king must move... and look who's standing behind him!"},
      {from:"e4",to:"d5",text:"The king runs to d5. But now the queen has no bodyguard!"},
      {from:"c2",to:"f5",text:"Bishop takes the queen! Skewer complete — the king was the shield, and shields have to move!"}]},
    {t:"move", prompt:"Your turn — SKEWER! Slide the rook to e1 to check the king and win the queen behind it.", fen:"4q3/8/8/8/4k3/8/8/1R4K1 w - - 0 1", from:"b1", targets:["e1"], after:"CHECK! The king must run, and the queen is next. Beautiful skewer! 🎯"},
    {t:"demo", fen:"4k3/8/8/8/8/8/3N4/3RK3 w - - 0 1", text:"The DISCOVERED ATTACK: one piece moves away and UNCOVERS another piece's attack. Like opening a curtain!",
     script:[
      {from:"d2",to:"f3",text:"The knight hops to f3... and suddenly the rook on d1 is staring straight at the black king!"},
      {from:"e8",to:"f8",text:"The black king shuffles aside... but it's too late!"},
      {from:"d1",to:"d8",text:"DISCOVERED CHECK! The knight's hop uncovered the rook's laser beam down the file!"}]},
    {t:"demo", fen:"4k3/3N4/8/1B6/8/8/8/4K3 w - - 0 1", text:"The DOUBLE CHECK: TWO pieces giving check at once! It's the most powerful move in chess.",
     script:[
      {from:"d7",to:"f6",text:"Knight jumps to f6 — CHECK! And it uncovered the bishop, which ALSO checks the king! Double check!"},
      {from:"e8",to:"d8",text:"Against a double check the king MUST move — you can't block two attackers or capture them both!"}]},
    {t:"say", text:"Remember the trio: SKEWER (attack the king, win the piece behind), DISCOVERED ATTACK (move one piece, uncover another's attack), DOUBLE CHECK (two checks — the king must run!). Tactics win pieces, and pieces win games! 🧙"},
  ],
  quiz:[
    {q:"In a SKEWER, which piece do you attack first?", choices:["The king — it must move, exposing the piece behind","The queen","A pawn","The weakest piece"], answer:0, explain:"Check the king FIRST! It has to move, and then you grab the juicy piece hiding behind it."},
    {q:"What is a DISCOVERED ATTACK?", choices:["Attacking with two knights at once","Moving one piece to uncover another piece's attack","Castling queenside","Promoting a pawn"], answer:1, explain:"Like opening a curtain — one piece steps aside and another piece's attack is revealed!"},
    {q:"Your opponent plays DOUBLE CHECK on you. What must you do?", choices:["Move the king","Block one attacker","Capture one attacker","Claim a draw"], answer:0, explain:"You can't block or capture TWO attackers at once — the king must move!"},
  ]},
{ id:"mates", title:"Checkmate Patterns", sub:"Back rank & the ladder",
  steps:[
    {t:"say", text:"Champions don't stumble into checkmate — they KNOW patterns! Master these two famous ones and you'll finish games like a pro. 🏆"},
    {t:"demo", fen:"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1", text:"The BACK-RANK MATE: the king is trapped on the back rank by his OWN pawns. All it takes is one rook!",
     script:[
      {from:"a1",to:"a8",text:"Rook crashes to a8 — CHECKMATE! The king can't step forward (his pawns block him) and can't escape sideways. His own army became his prison!"}]},
    {t:"tap", prompt:"Tap the mating square! Deliver back-rank mate.", fen:"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1", targets:["a8"], after:"BOOM! Back-rank mate! The pawns did the trapping, the rook did the finishing. 💥"},
    {t:"demo", fen:"7k/8/8/8/8/8/1R6/R5K1 w - - 0 1", text:"The LADDER MATE: two rooks take turns climbing, squeezing the king tighter and tighter!",
     script:[
      {from:"a1",to:"a7",text:"Rook number one climbs to the seventh rank — the king is squeezed!"},
      {from:"h8",to:"g8",text:"The king shuffles to g8..."},
      {from:"b2",to:"b8",text:"Rook number two joins the party — CHECKMATE! The rooks built a ladder the king can't climb down!"}]},
    {t:"move", prompt:"Your turn — deliver back-rank mate with the rook!", fen:"7k/5ppp/8/8/8/8/8/3R2K1 w - - 0 1", from:"d1", targets:["d8"], after:"MATE! One rook, one trapped king. Pattern recognized! 🏆"},
    {t:"say", text:"Two patterns, endless wins: BACK RANK (rook to the 8th when pawns trap the king) and the LADDER (two rooks climbing together). In your games, always be hunting for them! 🔍"},
  ],
  quiz:[
    {q:"What is BACK-RANK MATE?", choices:["Mating a king trapped on his back rank by his own pawns","Castling queenside","Promoting to a rook","Agreeing to a draw"], answer:0, explain:"His own pawns block his escape — one rook (or queen) on the back rank finishes it!"},
    {q:"In the LADDER mate, the two rooks…", choices:["Both hide behind pawns","Swap places with each other","Promote to queens","Take turns climbing ranks until the king is trapped"], answer:3, explain:"One rook climbs, the king shuffles, the other rook delivers — teamwork!"},
    {q:"You spot the enemy king stuck behind his own pawns. Your plan?", choices:["Trade queens immediately","March your king forward","Get a rook or queen to the back rank","Offer a draw"], answer:2, explain:"Back rank + trapped king = start hunting for mate!"},
  ]},
{ id:"strategy", title:"Think Like a Champion", sub:"Activity, weak squares & king safety",
  steps:[
    {t:"say", text:"Tactics win pieces — but STRATEGY wins games! Strategy means: put every piece on its best square, keep your king safe, and always ask: what is my opponent threatening? 🧠"},

     script:[
      {from:"e2",to:"e4",text:"e4! Fight for the center from move one."},
      {from:"e7",to:"e5",text:"Black answers the same way."},
      {from:"g1",to:"f3",text:"Knights before bishops — Nf3 attacks the center!"},
      {from:"b8",to:"c6",text:"Black develops a knight too."},
      {from:"f1",to:"c4",text:"Bishop to its happiest square, eyeing the middle! Developed, centered, ready to castle — champion thinking!"}]},
    {t:"board", fen:"3k4/8/8/3N4/8/8/8/4K3 w - - 0 1", hl:["d5"], text:"See this knight on d5? No black pawn can ever chase it away — that's an OUTPOST! A knight on an outpost is worth almost a rook. Always look for squares your pieces can't be kicked from!"},
    {t:"say", text:"KING SAFETY: castle early! A king stuck in the middle when the center opens up is a king in danger. Tuck him behind his pawns — then attack with everything else! 👑"},
    {t:"say", text:"The champion's thinking routine — ask before EVERY move: 1) What is my opponent threatening? 2) What are MY checks, captures and threats? Never move on autopilot! ♞"},
  ],
  quiz:[
    {q:"In the opening, a champion…", choices:["Develops pieces, fights for the center, castles early","Brings the queen out on move 2","Pushes only pawns","Trades everything fast"], answer:0, explain:"Develop, center, castle — the golden opening recipe!"},
    {q:"A knight parked where no pawn can attack it sits on…", choices:["A broken square","The edge (knights love edges!)","An outpost — a super-strong square","A trap"], answer:2, explain:"Outposts turn knights into monsters — nearly as strong as rooks!"},
    {q:"Before every move, a champion asks…", choices:["What is my opponent threatening?","What's for dinner?","How many moves until lunch?","Whose turn is it?"], answer:0, explain:"Checks, captures, threats — yours AND theirs. Every single move!"},
  ]},
];

/* ============================ 3H. LESSON PLAYER ========================== */
let LES = null; // {lesson, stepIdx}
function lessonUnlocked(i){ return i===0; }
async function lessonState(i){
  const v = await dbGet(`progress/${PROFILE.id}/lessons/${LESSONS[i].id}`);
  return v||null;
}
async function renderHome(){
  const [lessonsDone, skill, streak] = await Promise.all([
    dbGet(`progress/${PROFILE.id}/lessons`), dbGet(`progress/${PROFILE.id}/skill`),
    dbGet(`progress/${PROFILE.id}/streak`)]);
  const lvl = (skill&&skill.level)||1, xp=(skill&&skill.xp)||0;
  const doneCount = lessonsDone ? Object.keys(lessonsDone).length : 0;
  let rows = "";
  for(let i=0;i<LESSONS.length;i++){
    const st = lessonsDone && lessonsDone[LESSONS[i].id];
    const unlocked = i===0 || (lessonsDone && lessonsDone[LESSONS[i-1].id] && lessonsDone[LESSONS[i-1].id].completed);
    rows += `<div class="lesson-row${st&&st.completed?" done":""}${unlocked?"":" locked"}" ${unlocked?`onclick="startLesson(${i})"`:""}>
      <div class="lesson-num">${st&&st.completed?"✓":(i+1)}</div>
      <div class="lesson-info"><div class="t">${esc(LESSONS[i].title)}</div>
      <div class="s">${esc(LESSONS[i].sub)}</div></div>
      ${st&&st.stars?starsHTML(st.stars):(unlocked?"":"🔒")}
    </div>`;
  }
  const badges = await earnedBadges();
  view.innerHTML = topbar("Let's play chess!", false) + `
  <div class="card peach">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      ${avatarHTML(PROFILE,56)}
      <div><h2 style="margin:0">Hi ${esc(PROFILE.name)}! ♞</h2>
      <div class="muted">Level ${lvl} · ${xp} XP ${PROFILE._streak>1?`· <span class="streak">🔥 ${PROFILE._streak}</span>`:""}</div></div>
    </div>
    <div class="progressbar"><div style="width:${Math.min(100,(xp%100))}%"></div></div>
    ${PROFILE._coachFocus?`<div class="hint-box">🎯 Coach focus: <b>${esc(PROFILE._coachFocus)}</b></div>`:""}
  </div>
  ${coachCardHTML()}
  ${badges.length?`<div class="card"><h3>Your badges</h3>${badges.map(b=>`<span class="badge gold">${esc(b)}</span>`).join("")}</div>`:""}
  <div class="grid2">
    <button class="btn mint big" onclick="go('puzzles')">🧩 Puzzles</button>
    <button class="btn sky big" onclick="go('play')">🤖 Play computer</button>
  </div>
  <button class="btn lavender big" onclick="go('live')">👧🧒 Play family</button>
  <h2>📚 Lessons <span class="muted" style="font-size:15px">${doneCount}/${LESSONS.length} done</span></h2>
  ${rows}

/* animated demo step: pieces slide by themselves while the story is read aloud.

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function sqCenter(el, sq){
  const s=el.querySelector('[data-sq="'+sq+'"]');
  const r=s.getBoundingClientRect(), w=el.getBoundingClientRect();
  return {x:r.left-w.left+r.width/2, y:r.top-w.top+r.height/2, size:r.width};
}
function animateMove(el, game, from, to){
  return new Promise(resolve=>{
    const piece=game.get(from);
    const finish=()=>{ game.move({from:from,to:to,promotion:"q"}); resolve(); };
    if(!piece){ finish(); return; }
    try{
      const c1=sqCenter(el,from), c2=sqCenter(el,to);
      const ghost=document.createElement("div");
      ghost.className="piece-ghost";
      ghost.style.width=ghost.style.height=(c1.size*0.92)+"px";
      ghost.style.left=(c1.x-c1.size*0.46)+"px";
      ghost.style.top=(c1.y-c1.size*0.46)+"px";
      ghost.innerHTML='<svg class="pcsvg" style="width:100%;height:100%"><use href="#p'+piece.color+piece.type+'" xlink:href="#p'+piece.color+piece.type+'"/></svg>';
      el.appendChild(ghost);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        ghost.style.transform="translate("+(c2.x-c1.x)+"px,"+(c2.y-c1.y)+"px)";
      }));
      setTimeout(()=>{ try{ghost.remove();}catch(e){} finish(); },620);
    }catch(e){ finish(); }
  });
}
async function playDemo(s){
  const g=new Chess(s.fen);
  const el=$("#lb"); if(!el) return;
  drawBoard(el, g, {interactive:false});
  await speakWait(s.text);
  for(const st of (s.script||[])){
    if(!document.body.contains(el)) return;
    const dt=$("#demotxt"); if(dt) dt.textContent=st.text||"";
    const sayP = st.text ? speakWait(st.text) : Promise.resolve();
    if(st.from&&st.to){
      drawBoard(el, g, {highlights:arrayToHl([st.from]), interactive:false});
      await wait(550);
      if(!document.body.contains(el)) return;
      await animateMove(el, g, st.from, st.to);
      if(!document.body.contains(el)) return;
      drawBoard(el, g, {highlights:arrayToHl([st.to]), interactive:false});
    }
    await sayP;
    await wait(st.pause||900);
  }
  if(!document.body.contains(el)) return;
  const nx=$("#demonext"); if(nx) nx.style.display="";
  const rp=$("#demoreplay"); if(rp) rp.style.display="";
}

/* lesson interactive move: tap `from`, then a target; fallback accepts any legal move if targets illegal */
function runLessonMove(s, L){
  const g = new Chess(s.fen);
  const el = $("#lb");
  let sel = null;
  const legalTargets = s.targets.filter(t => g.moves({square:s.from, verbose:true}).some(m=>m.to===t));
  const acceptAny = legalTargets.length===0;
  const targets = acceptAny ? g.moves({square:s.from, verbose:true}).map(m=>m.to) : legalTargets;
  function draw(){
    const dots = sel ? g.moves({square:sel, verbose:true}).map(m=>m.to) : [];
    const hl = {}; targets.forEach(t=>{ if(sel) hl[t]="hint"; });
    if(sel) hl[sel]="sel";
    drawBoard(el, g, {highlights:hl, dots, interactive:true, onTap(sq){
      if(!sel){
        const pc = g.get(sq);
        if(pc && pc.color===g.turn() && sq===s.from){ sel=sq; draw(); }
        else { $("#movefb").innerHTML=`<div class="feedback try">${tryAgain()} Tap the piece we are learning about.</div>`; }
      } else {
        const mv = g.moves({square:sel, verbose:true}).find(m=>m.to===sq);
        if(mv){
          if(targets.includes(sq) || acceptAny){
            g.move({from:sel,to:sq,promotion:"q"});
            drawBoard(el, g, {interactive:false});
            $("#movefb").innerHTML=`<div class="feedback good">${praise()} ${esc(s.after||"Well moved!")}</div>`;
            confetti(50); logActivity("practice", L.id+" move");
            setTimeout(()=>{LES.step++;render("lesson");},1600);
          } else {
            $("#movefb").innerHTML=`<div class="feedback try">Good thinking — that's a legal move too! Now try a <b>glowing</b> square. ✨</div>`;
            sel=null; draw();
          }
        } else { sel=null; draw(); }
      }
    }});
  }
  draw();
}

/* ============================ 3J. BOARD RENDERER ========================= */
/* piece art now comes from the inlined Cburnett SVG sprite (#pwk…/#pbp) */
/* opts: {orientation:'w'|'b', highlights:{sq:'hint'|'good'|'sel'|'last'|'check'},
          dots:[sq], caps:[sq], interactive:bool, onTap(sq), showCoords} */
function drawBoard(el, game, opts){
  opts = opts||{};
  el.innerHTML="";
  const orient = opts.orientation||"w";
  const b = game.board();
  for(let r=0;r<8;r++) for(let f=0;f<8;f++){
    const rr = orient==="w"? r : 7-r;
    const ff = orient==="w"? f : 7-f;
    const sq = "abcdefgh"[ff] + (8-rr);
    const piece = b[rr][ff];
    const d = document.createElement("div");
    d.className = "square " + (((rr+ff)%2===0)?"light":"dark");
    d.dataset.sq = sq;
    if(piece){
      const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
      s.setAttribute("class","pcsvg");
      const u=document.createElementNS("http://www.w3.org/2000/svg","use");
      u.setAttribute("href","#p"+piece.color+piece.type);
      u.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href","#p"+piece.color+piece.type);
      s.appendChild(u); d.appendChild(s);
    }
    const hl = opts.highlights && opts.highlights[sq];
    if(hl==="hint") d.style.boxShadow="inset 0 0 0 5px rgba(127,182,245,.95)";
    else if(hl==="good") d.style.boxShadow="inset 0 0 0 5px rgba(111,207,151,.95)";
    else if(hl==="sel") d.classList.add("sel");
    else if(hl==="last") d.classList.add("lastmove");
    else if(hl==="check") d.classList.add("incheck");
    if(opts.dots && opts.dots.indexOf(sq)>=0){ const dot=document.createElement("div"); dot.className="dot"; d.appendChild(dot); }
    if(opts.caps && opts.caps.indexOf(sq)>=0){ const ring=document.createElement("div"); ring.className="cap-ring"; d.appendChild(ring); }
    if(opts.showCoords!==false){
      if(ff===0){ const c=document.createElement("span"); c.className="coord rank"; c.textContent=(8-rr); d.appendChild(c); }
      if(rr===7){ const c=document.createElement("span"); c.className="coord file"; c.textContent="abcdefgh"[ff]; d.appendChild(c); }
    }
    if(opts.interactive) d.addEventListener("click", ()=>opts.onTap(sq));
    el.appendChild(d);
  }
}
function kingInCheckSq(game){
  const turn = game.turn();
  for(let r=0;r<8;r++) for(let f=0;f<8;f++){
    const b=game.board()[r][f];
    if(b && b.type==="k" && b.color===turn) return "abcdefgh"[f]+(8-r);
  }
  return null;
}
function capturedTraysHTML(game){
  const hist = game.history({verbose:true});
  const wLost=[], bLost=[];
  hist.forEach(m=>{ if(m.captured){ (m.color==="w"?bLost:wLost).push(m.captured); } });
  const order={q:0,r:1,b:2,n:3,p:4};
  const g=(arr,color)=>arr.sort((a,b2)=>order[a]-order[b2]).map(t=>`<svg class="pcsvg" style="width:26px;height:26px"><use href="#p${color}${t}" xlink:href="#p${color}${t}"/></svg>`).join("");
  const score = materialScore(game);
  return `<div class="tray"><span class="muted" style="font-size:14px">You captured:</span> ${g(bLost,"b")} ${score>0?`<b>+${score}</b>`:""}</div>
          <div class="tray"><span class="muted" style="font-size:14px">Computer captured:</span> ${g(wLost,"w")} ${score<0?`<b>+${-score}</b>`:""}</div>`;
}
function materialScore(game){
  const V={p:1,n:3,b:3,r:5,q:9,k:0}; let s=0;
  game.board().forEach(row=>row.forEach(pc=>{ if(pc) s += (pc.color==="w"?1:-1)*V[pc.type]; }));
  return s;
}

async function pickPuzzle(){

async function attemptPuzzleMove(from,to,legal){
  const sol=PZ.puz.sol;
  const needPromo = !!sol.promotion;

  if(needPromo || (legal.promotion)){
    promo = await promoPicker(legal.promotion ? null : null); // picker handles it
  }
  const ok = (from===sol.from && to===sol.to && (!needPromo || promo===sol.promotion));
  if(ok){
    PZ.game.move({from,to,promotion:promo||"q"});
    drawBoard($("#pb"),PZ.game,{interactive:false,highlights:{[from]:"last",[to]:"last"}});
    $("#pzfb").innerHTML=`<div class="feedback good">${praise()} That's the move! 🎉</div>`;

    setTimeout(()=>{ render("puzzles"); },1800);
  } else {

      $("#pzfb").innerHTML=`<div class="feedback try">${tryAgain()} ${PZ.attempts===2?"Last try before I show you!":""}</div>`;

/* ============================ 3L. COMPUTER AI ============================ */
const AI_NAMES={1:"Sleepy Sloth 🦥",2:"Bouncy Bunny 🐰",3:"Clever Fox 🦊",4:"Wise Owl 🦉",5:"Turbo Tiger 🐯"};
const AI_DEPTH={1:1,2:1,3:2,4:2,5:3};
const AI_RANDOM={1:0.35,2:0.12,3:0.03,4:0,5:0};
const AI_BLURB={1:"makes sleepy mistakes — you can beat me!",2:"learning, just like you!",3:"thinks a couple moves ahead!",4:"a real challenge!",5:"grandmaster training mode!"};
/* piece-square tables (white perspective, a8=0 … h1=63) */
const PST={
p:[0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],
n:[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],
b:[-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,10,10,5,0,-10,-10,5,5,10,10,5,5,-10,-10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,-10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20],
r:[0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],
q:[-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],
k:[-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20]};
const PCVAL={p:100,n:320,b:330,r:500,q:900,k:0};
function evaluate(g){
  let s=0; const b=g.board();
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const pc=b[r][f]; if(!pc)continue;
    const idx=pc.color==="w"?r*8+f:(7-r)*8+f;
    const v=PCVAL[pc.type]+PST[pc.type][idx];
    s+=pc.color==="w"?v:-v;
  }
  return s;
}
let NODES=0;
function orderMoves(g){
  const moves=g.moves({verbose:true});
  moves.forEach(m=>{ m._s=(m.captured?10*PCVAL[m.captured]-PCVAL[m.piece]:0)+(m.promotion?900:0); });
  moves.sort((a,b)=>b._s-a._s);
  return moves;
}
function alphabeta(g,depth,alpha,beta,maxing){
  if(++NODES>25000) return evaluate(g);
  if(depth===0||g.game_over()){
    if(g.in_checkmate()) return maxing?-100000:100000;
    if(g.in_draw()||g.in_stalemate()||g.in_threefold_repetition()||g.insufficient_material()) return 0;
    return evaluate(g);
  }
  const moves=orderMoves(g);
  if(maxing){ let best=-Infinity;
    for(const m of moves){ g.move({from:m.from,to:m.to,promotion:m.promotion}); const v=alphabeta(g,depth-1,alpha,beta,false); g.undo();
      if(v>best)best=v; if(best>alpha)alpha=best; if(alpha>=beta)break; }
    return best;
  } else { let best=Infinity;
    for(const m of moves){ g.move({from:m.from,to:m.to,promotion:m.promotion}); const v=alphabeta(g,depth-1,alpha,beta,true); g.undo();
      if(v<best)best=v; if(best<beta)beta=best; if(alpha>=beta)break; }
    return best;
  }
}
function aiBestMove(g,level){
  const moves=orderMoves(g);
  if(!moves.length) return null;
  if(Math.random()<AI_RANDOM[level]) return moves[Math.floor(Math.random()*moves.length)];
  const depth=AI_DEPTH[level], maxing=g.turn()==="w";
  NODES=0; let best=moves[0], bestV=maxing?-Infinity:Infinity;
  for(const m of moves){
    g.move({from:m.from,to:m.to,promotion:m.promotion});
    const v=alphabeta(g,depth-1,-Infinity,Infinity,!maxing);
    g.undo();
    const better = maxing ? v>bestV+ (level===4?Math.random()*8:0) : v<bestV-(level===4?Math.random()*8:0);
    if(better){ bestV=v; best=m; }
  }
  return best;
}

  const g=PG.game, el=$("#gb"); if(!el)return;

async function doKidMove(mv){
  let promo=null;

function afterMove(){

function aiMove(){
  if(PG.over||PG.game.turn()===PG.kidColor)return;
  const m=aiBestMove(PG.game,PG.aiLevel);
  if(!m){endComputerGame();return;}
  const res=PG.game.move({from:m.from,to:m.to,promotion:m.promotion||"q"});
  PG.lastMove={from:res.from,to:res.to}; PG.moves++;
  const gmsg=$("#gmsg"); if(gmsg)gmsg.innerHTML="";
  drawPlayBoard(); updateMoveList();
  if(PG.game.game_over()) endComputerGame();
}
function updateMoveList(){

}
function offerDraw(){ if(!PG.over){ PG.over=true; finishComputerGame("draw","You agreed a draw — well played!"); } }
/* Take back the last full round (kid's move + computer's reply). Max 3 per game. */
function canUndo(){
  if(!PG||PG.over||PG.undosLeft<=0) return false;
  const hlen=PG.game.history().length;
  return PG.game.turn()===PG.kidColor ? hlen>=2 : hlen>=1;
}
function undoMove(){
  if(!canUndo())return;
  const g=PG.game;
  if(g.turn()===PG.kidColor){ g.undo(); g.undo(); } else { g.undo(); }
  PG.undosLeft--; PG.moves=g.history().length; PG.sel=null;
  const vh=g.history({verbose:true});
  PG.lastMove=vh.length?{from:vh[vh.length-1].from,to:vh[vh.length-1].to}:null;
  drawPlayGame();
  toast(`↩️ Move taken back — ${PG.undosLeft} undo${PG.undosLeft===1?"":"s"} left`);
}

async function endComputerGame(){

}

async function recordLiveResult(winner){
  const d=LG.data;
  const pids=[d.white,d.black].filter(Boolean);
  await dbPush("games",{type:"vs-kid",profileIds:pids,result:winner==="draw"?"draw":(winner==="w"?"white-wins":"black-wins"),
    winnerPid:winner==="draw"?null:(winner==="w"?d.white:d.black),moveCount:(d.moves||[]).length+1,createdAt:Date.now()});
  await logActivity("livegame",`finished ${LG.code}: ${winner}`);
}
async function resignLive(){
  if(!LG||!LG.data||LG.data.status!=="active")return;
  if(!confirm("Resign this game? Your opponent will win — tap Cancel to keep playing!"))return;
  const myColor=LG.data.white===PROFILE.id?"w":"b";
  const winner=myColor==="w"?"b":"w";
  await recordLiveResult(winner);
  await dbUpdate(`liveGames/${LG.code}`,{status:"finished",winner,updatedAt:Date.now()});
}
async function leaveLive(){ back(); }
function onLiveFinished(d){
  const wnames={w:"White",b:"Black",draw:null};
  let title,msg,win=false;
  if(d.winner==="draw"){title="Draw!";msg="Well played, both of you! 🤝";}
  else{
    const iWon=(d.winner==="w"&&d.white===PROFILE.id)||(d.winner==="b"&&d.black===PROFILE.id);
    win=iWon; title=iWon?"You win! 🏆":"Good game!";
    msg=iWon?`${praise()} Victory against ${esc(LG.oppName)}!`:`${esc(LG.oppName)} wins this one — rematch? 💪`;
  }
  if(win){addXP(15);confetti(100);}
  view.innerHTML=topbar("Game over",false)+`
  <div class="card ${win?"butter":"sky"} center"><div class="big-emoji">${win?"🏆":"🤝"}</div>
  <h1>${title}</h1><p style="font-size:19px">${msg}</p>
  <button class="btn primary big" onclick="render('live')">↻ New family game</button>
  <button class="btn ghost big" onclick="NAV=['home'];render('home')">Home</button></div>`;
  try{ setTimeout(()=>{ref(`liveGames/${LG.code}`).remove().catch(()=>{});},30000); }catch(e){}
}

/* ---- pass-and-play ---- */
let PP=null;
function startPassPlay(){
  PP={game:new Chess(),sel:null,lastMove:null,over:false}; NAV.push("passplay"); drawPassPlay();
}
function renderPassPlayAlias(){ drawPassPlay(); }
function drawPassPlay(){
  const g=PP.game;
  view.innerHTML=topbar("Pass-and-play")+`
  <div class="card mint"><p class="center"><b>${g.turn()==="w"?"White":"Black"}</b> to move — pass the iPad! 📱</p>
  <div class="board-wrap"><div class="board" id="ppb"></div></div>
  <div id="ppmsg"></div>
  <div class="center"><button class="btn ghost" onclick="back()">End game</button></div></div>`;
  const el=$("#ppb"); const hl={};
  if(PP.lastMove){hl[PP.lastMove.from]="last";hl[PP.lastMove.to]="last";}
  if(g.in_check()){const k=kingInCheckSq(g);if(k)hl[k]="check";}
  let dots=[],caps=[];
  if(PP.sel){const mv=g.moves({square:PP.sel,verbose:true});dots=mv.filter(m=>!m.captured).map(m=>m.to);caps=mv.filter(m=>m.captured).map(m=>m.to);hl[PP.sel]="sel";}
  drawBoard(el,g,{highlights:hl,dots,caps,interactive:!PP.over,onTap:async sq=>{
    if(PP.over)return;
    if(!PP.sel){const pc=g.get(sq);if(pc&&pc.color===g.turn()){PP.sel=sq;drawPassPlay();}return;}
    if(sq===PP.sel){PP.sel=null;drawPassPlay();return;}
    const mv=g.moves({square:PP.sel,verbose:true}).find(m=>m.to===sq);
    if(!mv){const pc=g.get(sq);PP.sel=(pc&&pc.color===g.turn())?sq:null;drawPassPlay();return;}
    let promo=null; if(mv.promotion)promo=await promoPicker();
    const res=g.move({from:mv.from,to:mv.to,promotion:promo||"q"});
    PP.sel=null;PP.lastMove={from:res.from,to:res.to};
    if(g.game_over()){PP.over=true;
      const msg=g.in_checkmate()?`Checkmate! ${(g.turn()==="w"?"Black":"White")} wins! 🏆`:"Draw! Well played both! 🤝";
      $("#ppmsg").innerHTML=`<div class="feedback good" style="text-align:center;font-size:20px">${msg}</div>`;confetti(80);
    }
    drawPassPlay();
  }});
}
/* ---- pass-and-play uses drawPassPlay directly via the render table ---- */

/* Parent play mode: grown-ups get the full lessons + play experience under their own profile */
async function parentPlayMode(){
  if(!PROFILE||PROFILE.role!=="parent"){ NAV=["profiles"]; render("profiles"); return; }
  await loadCoaching();
  try{ await touchStreak(true); }catch(e){}
  NAV=["parent","home"]; render("home");
}
async function resetFamily(){
  if(!confirm("Start over? This erases ALL profiles, progress and games for this family.")) return;
  try{ if(FAM) await DB.ref("families/"+FAM).remove(); }catch(e){}
  try{ localStorage.removeItem(LS_FAM); }catch(e){}
  location.reload();
}
async function parentTab(pid,el){
  $$(".tab").forEach(t=>t.classList.remove("sel")); if(el)el.classList.add("sel");
  $("#ptab").innerHTML=`<p class="center muted">Loading ${esc(PROFILES[pid].name)}…</p>`;
  const [lessons,skill,puz,puzR,streak,badges,acts,coach,gamesSnap]=await Promise.all([
    dbGet(`progress/${pid}/lessons`),dbGet(`progress/${pid}/skill`),dbGet(`progress/${pid}/puzzles`),
    dbGet(`progress/${pid}/puzzleRating`),dbGet(`progress/${pid}/streak`),dbGet(`progress/${pid}/badges`),
    ref(`activities/${pid}`).limitToLast(8).once("value").then(s=>s.val()),
    dbGet(`coaching/${pid}/directives`),
    ref("games").limitToLast(60).once("value").then(s=>s.val()),
  ]);
  const lArr=lessons?Object.values(lessons):[];
  const done=lArr.filter(l=>l.completed).length;
  const stars=lArr.reduce((a,l)=>a+(l.stars||0),0);
  const qAvg=lArr.length?(lArr.reduce((a,l)=>a+(l.bestScore||0),0)/(lArr.length*3)*100):0;
  const pzArr=puz?Object.values(puz):[];
  const solved=pzArr.filter(p=>p.solved).length;
  const gArr=gamesSnap?Object.values(gamesSnap).filter(g=>(g.profileIds||[]).includes(pid)):[];
  const vsc=gArr.filter(g=>g.type==="vs-computer");
  const w=vsc.filter(g=>g.result==="win").length, l=vsc.filter(g=>g.result==="loss").length, d=vsc.filter(g=>g.result==="draw").length;
  const vsk=gArr.filter(g=>g.type==="vs-kid").length;
  const actArr=acts?Object.entries(acts).map(([id,a])=>a).sort((a,b)=>b.createdAt-a.createdAt):[];
  const coachArr=coach?Object.entries(coach).map(([id,c])=>Object.assign({id},c)).sort((a,b)=>b.createdAt-a.createdAt).slice(0,5):[];
  const ago=ts=>{const m=Math.floor((Date.now()-ts)/60000);return m<1?"just now":m<60?m+"m ago":Math.floor(m/60)+"h ago";};
  $("#ptab").innerHTML=`
  <div class="grid2">
    <div><div class="kv"><span>🎂 Age</span><b>${esc(String((PROFILES[pid]&&PROFILES[pid].age)||"—"))}</b></div>
    <div class="kv"><span>Level / XP</span><b>${(skill&&skill.level)||1} · ${(skill&&skill.xp)||0} XP</b></div>
    <div class="kv"><span>🔥 Streak</span><b>${(streak&&streak.count)||0} days</b></div>
    <div class="kv"><span>📚 Lessons</span><b>${done}/${LESSONS.length} · ${stars}★</b></div>
    <div class="kv"><span>📝 Quiz average</span><b>${Math.round(qAvg)}%</b></div></div>
    <div><div class="kv"><span>🧩 Puzzles</span><b>${solved} solved · rating ${puzR||400}</b></div>
    <div class="kv"><span>🤖 vs Computer</span><b>${w}W / ${l}L / ${d}D</b></div>
    <div class="kv"><span>👧🧒 vs Family</span><b>${vsk} games</b></div>
    <div class="kv"><span>🏅 Badges</span><b>${badges?Object.keys(badges).length:0}</b></div></div>
  </div>
  <h3>Recent activity</h3>
  ${actArr.length?actArr.map(a=>`<div class="kv"><span>${esc(a.type)} — ${esc(a.detail||"")}</span><span class="muted">${ago(a.createdAt)}</span></div>`).join(""):'<p class="muted">No activity yet.</p>'}
  <h3>Coaching log (Stella)</h3>
  ${coachArr.length?coachArr.map(c=>`<div class="kv"><span><b>${esc(c.kind)}</b> — ${esc(c.text)}</span><span class="muted">${ago(c.createdAt)}</span></div>`).join(""):'<p class="muted">No coaching notes yet.</p>'}`;
}
