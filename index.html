<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFE3C9">
<title>Chess Learning App</title>
<!--
  ============================================================================
  CHESS LEARNING APP — single-file build
  ----------------------------------------------------------------------------
  SECTIONS:
    1. CSS (pastel theme, iPad-friendly touch targets)
    2. HTML screens (family gate, profiles, home, lesson, quiz, puzzles,
       play vs computer, live games, parent dashboard)
    3. JS:
       A. FIREBASE_CONFIG (<<< GROWN-UP: FILL THIS IN >>>)
       B. Firebase init + anonymous auth + family-code gate
       C. Profiles (per-device remember-me)
       D. Curriculum data (12 lessons) + lesson player
       E. Quiz engine
       F. Puzzle trainer (adaptive ladder)
       G. Chess board renderer (tap-to-move, chess.js rules)
       H. Computer AI (alpha-beta minimax, levels 1-5)
       I. Live cross-iPad games + pass-and-play
       J. Parent dashboard (PIN-gated)
       K. Coaching directives from Stella + activity log
       L. Rewards (stars, badges, streaks, confetti) + boot
  ============================================================================
-->
<style>
/* ============================ 1. CSS ================================== */
:root{
  --cream:#FFF9F1; --peach:#FFE3C9; --mint:#D3EEDC; --lavender:#E2D8F7;
  --sky:#CFE8FA; --butter:#FFEBA8; --rose:#FFD9E0; --coral:#FFB59E; --grape:#DCD0F7;
  --ink:#4A4458; --ink-soft:#7A7390; --white:#FFFFFF;
  --sq-light:#F6E7C8; --sq-dark:#D9A97E;
  --shadow:0 6px 18px rgba(120,100,140,.14);
  --radius:22px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--cream); color:var(--ink);
  min-height:100vh; min-height:100dvh;
  touch-action:manipulation; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
}
#app{max-width:980px;margin:0 auto;padding:16px 16px 48px;}
.screen{display:none;animation:fadeIn .25s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
h1{font-size:32px;margin:12px 0;} h2{font-size:24px;margin:10px 0;} h3{font-size:19px;margin:8px 0;}
p{font-size:17px;line-height:1.55;color:var(--ink);}
.muted{color:var(--ink-soft);} .center{text-align:center;}
.game-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 2px;border-top:1px dashed rgba(90,70,140,.25);text-align:left;}
.game-row .btn{flex:none;}
.ttt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:14px auto;}
.ttt-cell{aspect-ratio:1;border:none;border-radius:18px;background:#FFF7E8;font-family:inherit;font-size:50px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(90,70,140,.18);display:flex;align-items:center;justify-content:center;padding:0;}
.ttt-cell.win{background:#CDEAC0;}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin:14px 0;}
.card.peach{background:var(--peach);} .card.mint{background:var(--mint);}
.card.lavender{background:var(--lavender);} .card.sky{background:var(--sky);}
.card.butter{background:var(--butter);} .card.rose{background:var(--rose);} .card.grape{background:var(--grape);}
.btn{
  display:inline-block;border:none;cursor:pointer;font-weight:700;color:var(--ink);
  font-size:19px;padding:16px 26px;border-radius:18px;margin:8px 6px 8px 0;
  background:var(--butter);box-shadow:0 4px 0 rgba(0,0,0,.08);min-height:56px;min-width:44px;
  transition:transform .08s ease;
}
.btn:active{transform:scale(.96);}
.btn.primary{background:#FFC98B;} .btn.mint{background:var(--mint);}
.btn.sky{background:var(--sky);} .btn.lavender{background:var(--lavender);} .btn.butter{background:var(--butter);}
.btn.rose{background:var(--rose);} .btn.ghost{background:#F1EDE6;}
.btn.big{font-size:22px;padding:20px 34px;width:100%;margin:10px 0;}
.btn:disabled{opacity:.45;cursor:default;}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.backbtn{border:none;background:var(--white);box-shadow:var(--shadow);border-radius:14px;
  font-size:20px;font-weight:700;color:var(--ink);min-width:52px;min-height:52px;cursor:pointer;}
.backbtn:active{transform:scale(.94);}
.profile-chip{margin-left:auto;background:var(--white);border-radius:999px;padding:8px 16px;
  box-shadow:var(--shadow);font-weight:700;display:flex;align-items:center;gap:8px;min-height:52px;}
.avatar{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:#fff;flex:none;}
/* lesson path */
.lesson-row{display:flex;align-items:center;gap:14px;background:var(--white);border-radius:18px;
  box-shadow:var(--shadow);padding:14px 16px;margin:10px 0;cursor:pointer;min-height:76px;}
.lesson-row:active{transform:scale(.98);}
.lesson-row.locked{opacity:.5;cursor:default;}
.lesson-num{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;background:var(--lavender);color:var(--ink);}
.lesson-row.done .lesson-num{background:var(--mint);}
.lesson-info{flex:1;} .lesson-info .t{font-weight:800;font-size:18px;} .lesson-info .s{color:var(--ink-soft);font-size:14px;}
.stars{color:#E8A93D;font-size:20px;letter-spacing:2px;}
/* chess board */
.board-wrap{display:flex;justify-content:center;margin:12px 0;}
.board{display:grid;grid-template-columns:repeat(8,1fr);width:min(92vw,560px);aspect-ratio:1/1;
  border-radius:14px;overflow:hidden;box-shadow:0 12px 28px rgba(80,50,20,.35),inset 0 0 0 2px rgba(255,255,255,.18);border:6px solid #8a5a33;position:relative;}
.square{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;aspect-ratio:1/1;}
.square.light{background:linear-gradient(145deg,#f8ecd2 0%,#eedcab 100%);}
.square.dark{background:linear-gradient(145deg,#c08a5a 0%,#a26e42 100%);}
.pcsvg{width:92%;height:92%;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
.square.sel{outline:4px solid #7FB6F5;outline-offset:-4px;}
.square.lastmove::after{content:"";position:absolute;inset:0;background:rgba(255,235,140,.55);pointer-events:none;}
.square.incheck::after{content:"";position:absolute;inset:0;background:rgba(255,110,110,.55);pointer-events:none;}
.square .dot{position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(90,140,90,.5);pointer-events:none;}
.square .cap-ring{position:absolute;inset:6%;border-radius:50%;border:5px solid rgba(90,140,90,.55);pointer-events:none;}
.square .coord{position:absolute;font-size:11px;font-weight:700;opacity:.65;pointer-events:none;}
.coord.rank{top:2px;left:4px;} .coord.file{bottom:2px;right:5px;}
/* rev 13: coordinates — bigger and clearer on every board */
.square .coord{font-size:13px;font-weight:800;opacity:.85;}
/* rev 13: 3D stage for game boards (player-perspective tilt + spin, Merida pieces standing) */
.board-wrap.stage-wrap{perspective:1050px;padding:30px 12px 24px;border-radius:18px;
  background:radial-gradient(ellipse at 50% 32%,#57493A,#241D15 80%);}
.board3d-on{overflow:visible;transform-style:preserve-3d;border-color:#2A1D12;
  transform:rotateX(var(--tilt,52deg)) rotateZ(var(--spin,0deg));}
.board3d-on::before{content:"";position:absolute;inset:-14px;border-radius:12px;
  background:linear-gradient(145deg,#5C4630,#33241A);transform:translateZ(-6px);}
.board3d-on::after{content:"";position:absolute;inset:-14px;border-radius:12px;
  background:linear-gradient(145deg,#1C150E,#0B0805);transform:translateZ(-18px);}
.board3d-on .square{transform-style:preserve-3d;}
.board3d-on .square.light{background:linear-gradient(145deg,#F2F2D8,#E7E7C8);}
.board3d-on .square.dark{background:linear-gradient(145deg,#7FA35C,#6B9150);}
.board3d-on .square.light .coord{color:#5F7D43;} .board3d-on .square.dark .coord{color:#EFF3DC;}
.board3d-on .pshadow{position:absolute;left:50%;bottom:34%;width:82%;height:25%;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(20,30,8,.5),rgba(20,30,8,0) 66%);pointer-events:none;}
.board3d-on .pcw{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none;}
.board3d-on .pci{position:absolute;left:50%;bottom:50%;width:103%;transform-origin:50% 100%;pointer-events:none;
  transform:translateX(-50%) rotateZ(calc(var(--spin,0deg) * -1)) rotateX(calc(var(--tilt,52deg) * -1));}
.board3d-on .pcsvg{width:100%;height:auto;filter:drop-shadow(3px 5px 4px rgba(15,25,5,.45));}
.viewctl{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0 2px;
  font-weight:700;font-size:14px;color:var(--ink-soft);}
.viewctl input[type=range]{width:110px;vertical-align:middle;}
/* rev 14: nearby play QR bits */
.qrbox{width:min(78vw,340px);margin:10px auto;background:#fff;padding:6px;border-radius:12px;}
.qrbox svg{width:100%;height:auto;display:block;}
.scanvideo{width:min(84vw,420px);max-height:46vh;border-radius:14px;background:#000;}
/* rev 13: home jumbo tiles (option B) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0;}
.jtile{border:none;border-radius:20px;padding:16px 14px;min-height:112px;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:space-between;gap:8px;box-shadow:var(--shadow);cursor:pointer;text-align:left;}
.jtile .jg{font-size:42px;line-height:1;}
.jtile .jl{font-weight:800;font-size:18px;color:var(--ink);line-height:1.15;}
.jtile.mint{background:var(--mint);} .jtile.sky{background:var(--sky);} .jtile.rose{background:var(--rose);}
.jtile.butter{background:var(--butter);} .jtile.lav{background:var(--lavender);} .jtile.peach{background:var(--peach);}
.square.light .coord{color:#a07c4f;} .square.dark .coord{color:#f6e7c8;}
.piece-ghost{position:absolute;z-index:5;pointer-events:none;transition:transform .55s ease-in-out;}
.iconbtn{background:var(--white);border:2px solid var(--peach);border-radius:50%;width:44px;height:44px;
  font-size:20px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;}
.tray{display:flex;flex-wrap:wrap;gap:2px;min-height:34px;align-items:center;font-size:24px;margin:6px 0;}
.movelist{background:#FBF7EF;border-radius:14px;padding:10px 14px;max-height:150px;overflow-y:auto;font-size:15px;margin:8px 0;}
.movelist table{width:100%;border-collapse:collapse;} .movelist td{padding:3px 6px;}
/* quiz */
.choice{display:block;width:100%;text-align:left;background:var(--white);border:3px solid transparent;
  border-radius:16px;padding:16px;font-size:18px;font-weight:600;color:var(--ink);margin:10px 0;cursor:pointer;min-height:60px;}
.choice:active{transform:scale(.98);}
.choice.correct{border-color:#6FCF97;background:#E9F9EF;}
.choice.wrong{border-color:#F19999;background:#FDECEC;}
.feedback{border-radius:16px;padding:16px;font-size:17px;margin:12px 0;font-weight:600;}
.feedback.good{background:var(--mint);} .feedback.try{background:var(--peach);}
/* misc */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:640px){.grid2{grid-template-columns:1fr;}}
.badge{display:inline-block;background:var(--lavender);border-radius:999px;padding:8px 16px;margin:4px;font-weight:700;font-size:15px;}
.badge.gold{background:var(--butter);}
.streak{display:inline-flex;align-items:center;gap:6px;background:#FFE9D6;border-radius:999px;padding:8px 16px;font-weight:800;}
input[type=text],input[type=number],input[type=tel]{font-size:20px;padding:16px;border-radius:16px;border:3px solid #E7DFD2;
  width:100%;margin:8px 0;background:#fff;color:var(--ink);font-family:inherit;}
input:focus{outline:none;border-color:#B79CED;}
.code-big{font-size:40px;font-weight:800;letter-spacing:10px;background:var(--white);border-radius:18px;
  padding:18px;text-align:center;box-shadow:var(--shadow);margin:14px 0;font-family:ui-monospace,monospace;}
.pinrow{display:flex;gap:10px;justify-content:center;}
.pinrow input{width:64px;text-align:center;font-size:28px;}
table.stats{width:100%;border-collapse:collapse;font-size:16px;}
table.stats td,table.stats th{padding:10px 8px;border-bottom:2px solid #F1EAE0;text-align:left;}
table.stats th{color:var(--ink-soft);}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:14px 24px;border-radius:999px;font-weight:700;font-size:17px;opacity:0;transition:all .3s;z-index:99;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:98;overflow:hidden;}
.confetti-piece{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
.coach-card{background:linear-gradient(135deg,var(--lavender),var(--sky));border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin:14px 0;}
.coach-card .who{font-weight:800;font-size:17px;margin-bottom:6px;}
.progressbar{height:14px;background:#EFE7D8;border-radius:999px;overflow:hidden;margin:8px 0;}
.progressbar>div{height:100%;background:linear-gradient(90deg,#FFC98B,#FF9E7D);border-radius:999px;transition:width .4s;}
.diff-pick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.diff-btn{border:3px solid transparent;background:var(--white);border-radius:14px;padding:12px 14px;font-weight:700;
  cursor:pointer;min-height:56px;box-shadow:var(--shadow);font-size:15px;}
.diff-btn.sel{border-color:#B79CED;background:var(--lavender);}
.netpill{position:fixed;right:14px;bottom:14px;background:#8A5A44;color:#fff;padding:10px 16px;
  border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow);z-index:60;max-width:88vw;}
.lobby-code{font-size:52px;font-weight:800;letter-spacing:8px;text-align:center;background:var(--butter);
  border-radius:18px;padding:16px;margin:12px 0;}
.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
.tab{border:none;background:#F1EDE6;border-radius:999px;padding:12px 20px;font-weight:700;font-size:16px;cursor:pointer;min-height:48px;}
.tab.sel{background:var(--ink);color:#fff;}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px solid #F4EEE2;font-size:16px;}
.kv b{font-size:17px;}
.hint-box{background:var(--sky);border-radius:14px;padding:14px 16px;margin:10px 0;font-size:16px;}
.big-emoji{font-size:54px;}
.promo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0;}
.promo-grid button{font-size:44px;background:var(--white);border:3px solid #E7DFD2;border-radius:16px;padding:10px;cursor:pointer;min-height:76px;}
</style>
</head>

const $ = (sel, el) => (el||document).querySelector(sel);
const $$ = (sel, el) => Array.from((el||document).querySelectorAll(sel));

function toast(msg, ms){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), ms||2600);
}
function rnd(n){ const c="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function rid(n){ const c="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"; let s=""; for(let i=0;i<(n||24);i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function hashPin(pin){ let h=0; for(let i=0;i<pin.length;i++){ h=((h<<5)-h+pin.charCodeAt(i))|0; } return "p"+(h>>>0).toString(36); }
function confetti(n){
  const box = $("#confetti"); const colors=["#FFB59E","#BFE3C6","#DCCFF5","#A9D3F2","#FFE9A8","#FFC9D6"];
  for(let i=0;i<(n||80);i++){
    const d=document.createElement("div"); d.className="confetti-piece";
    d.style.left=Math.random()*100+"vw"; d.style.background=colors[i%colors.length];
    d.style.animationDuration=(2.2+Math.random()*2.2)+"s"; d.style.animationDelay=(Math.random()*0.6)+"s";
    d.style.transform="rotate("+Math.random()*360+"deg)";
    box.appendChild(d); setTimeout(()=>d.remove(),5200);
  }
}
const PRAISE = ["Brilliant!","Amazing thinking!","You did it!","Superstar move!","Wow, well played!","Clever, clever!","Champion thinking!"];

function praise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }
function tryAgain(){ return TRYAGAIN[Math.floor(Math.random()*TRYAGAIN.length)]; }
function avatarHTML(p, size){
  const initial = esc((p.name||"?").trim().charAt(0).toUpperCase());

/* ---- tiny db helpers (all paths under /families/{FAM}) ---- */
function ref(path){ return DB.ref("families/"+FAM+"/"+path); }

/* ===================== REV 12: OFFLINE MODE =====================
   The app keeps a local mirror of every profile's progress (LPROG) plus a
   durable outbox of pending writes. Offline (car, plane, no Wi-Fi) the app
   still boots from the on-device cache, progress updates the mirror
   instantly, and every write waits in the outbox; when the connection
   returns, the outbox flushes to Firebase and the mirror re-syncs from the
   server. Live cross-iPad games still need the internet — everything else
   (lessons, puzzles, vs-computer, demos, pass-and-play) works offline. */
let OFFLINE=false;
let LPROG={};
let PINHASH=null;
const LS_CACHE="cla_cache_v1";
const LS_OUTBOX="cla_outbox_v1";
let OUTBOX=[]; try{ OUTBOX=JSON.parse(localStorage.getItem(LS_OUTBOX)||"[]"); if(!Array.isArray(OUTBOX)) OUTBOX=[]; }catch(e){ OUTBOX=[]; }
let FLUSHING=false;

function saveOutbox(){ try{ localStorage.setItem(LS_OUTBOX, JSON.stringify(OUTBOX)); }catch(e){} }
function saveCache(){ try{ if(FAM) localStorage.setItem(LS_CACHE, JSON.stringify({fam:FAM, profiles:PROFILES, pinHash:PINHASH, progress:LPROG, savedAt:Date.now()})); }catch(e){} }
function loadCache(){ try{ const c=JSON.parse(localStorage.getItem(LS_CACHE)||"null"); return (c&&c.fam&&c.fam===FAM)?c:null; }catch(e){ return null; } }
function updateNetPill(){
  const el=document.getElementById("netpill"); if(!el) return;
  if(OFFLINE){ el.style.display="block";
    el.textContent = OUTBOX.length? `📴 Offline — ${OUTBOX.length} thing${OUTBOX.length===1?"":"s"} saved on this iPad` : "📴 Offline — saving on this iPad";
  } else el.style.display="none";
}
function queueSet(path, val){
  OUTBOX=OUTBOX.filter(op=>op.path!==path);
  OUTBOX.push({path, val});
  saveOutbox(); updateNetPill(); flushOutbox();
}
async function flushOutbox(){
  if(FLUSHING||!DB||!FAM||OFFLINE||!OUTBOX.length) return;
  FLUSHING=true; let n=0;
  while(OUTBOX.length){
    const op=OUTBOX[0];
    try{ await DB.ref("families/"+FAM+"/"+op.path).set(op.val); }
    catch(e){ break; }
    OUTBOX.shift(); n++; saveOutbox();
  }
  FLUSHING=false; updateNetPill();
  if(n&&!OUTBOX.length) toast("☁️ Synced! Everything saved is now backed up.");
}
function watchConnection(){
  try{
    DB.ref(".info/connected").on("value", async snap=>{
      if(snap.val()===true){
        const was=OFFLINE; OFFLINE=false; updateNetPill();
        await flushOutbox();
        if(was&&PROFILE&&!OUTBOX.length){
          try{ const v=await ref("progress").once("value").then(s=>s.val()); if(v){ LPROG=v; saveCache(); } }catch(e){}
          try{ const pv=await ref("profiles").once("value").then(s=>s.val()); if(pv){ PROFILES=pv; saveCache(); } }catch(e){}
        }
      } else { OFFLINE=true; updateNetPill(); }
    });
  }catch(e){}
  try{ window.addEventListener("online", ()=>flushOutbox()); }catch(e){}
}
function progWalk(path){
  const parts=path.split("/").slice(1); let o=LPROG;
  for(const p of parts){ if(o==null||typeof o!=="object") return undefined; o=o[p]; }
  return o;
}
function progPut(path, val){
  const parts=path.split("/").slice(1); let o=LPROG;
  for(let i=0;i<parts.length-1;i++){ if(o[parts[i]]==null||typeof o[parts[i]]!=="object") o[parts[i]]={}; o=o[parts[i]]; }
  o[parts[parts.length-1]]=val;
}
function clone(v){ return v==null?v:JSON.parse(JSON.stringify(v)); }

function dbGet(path){
  if(path.indexOf("progress/")===0){
    const v=progWalk(path);
    if(v!==undefined) return Promise.resolve(clone(v));
    if(OFFLINE) return Promise.resolve(null);
    return ref(path).once("value").then(s=>s.val());
  }
  if(path==="meta"&&OFFLINE) return Promise.resolve(PINHASH?{parentPinHash:PINHASH}:null);
  return ref(path).once("value").then(s=>s.val());
}
function dbSet(path, val){
  if(path.indexOf("progress/")===0){ progPut(path, clone(val)); saveCache(); queueSet(path, clone(val)); return Promise.resolve(); }
  return ref(path).set(val);
}
function dbUpdate(path, val){ return ref(path).update(val); }
function dbPush(path, val){
  if(path==="games"||path.indexOf("activities/")===0){
    const r=ref(path).push();
    queueSet(path+"/"+r.key, val);
    return r;
  }
  return ref(path).push(val);
}
async function logActivityFor(pid, type, detail){
  if(!pid) return;
  try{ await dbPush(`activities/${pid}`, {type, detail:detail||"", createdAt:Date.now()}); }catch(e){}
}
async function logActivity(type, detail){
  if(!PROFILE) return;
  return logActivityFor(PROFILE.id, type, detail);
}
async function loadAllProgress(){
  if(!OFFLINE){
    try{ const v=await ref("progress").once("value").then(s=>s.val()); if(v){ LPROG=v; saveCache(); return; } }catch(e){}
  }
  const c=loadCache(); if(c&&c.progress) LPROG=c.progress;
}

/* ============================ VOICE (story narration) ============================
   Reads lesson steps aloud using the iPad's own voices (including Siri voices
   on iPadOS 16+). Toggle in the topbar; choice remembered per device. */
const LS_VOICE="cla_voice_on";
let VOICE_ON=true;
try{ VOICE_ON = localStorage.getItem(LS_VOICE)!=="0"; }catch(e){}
let VOICE_PICKED=null;
function pickVoice(){
  try{
    const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    if(!vs.length) return null;
    const en=vs.filter(v=>/^en([-_]|$)/i.test(v.lang||""));
    const pool=en.length?en:vs;
    return pool.find(v=>/siri/i.test(v.name))||pool.find(v=>/natural|neural|premium|enhanced/i.test(v.name))||pool[0]||null;
  }catch(e){ return null; }
}
function cleanSpeech(t){
  return (t||"").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu,"").replace(/\s+/g," ").trim();
}
function speak(text){
  stopSpeak();
  text=cleanSpeech(text);
  if(!VOICE_ON||!text) return;
  try{
    if(!("speechSynthesis" in window)) return;
    if(!VOICE_PICKED) VOICE_PICKED=pickVoice();
    const u=new SpeechSynthesisUtterance(text);
    if(VOICE_PICKED) u.voice=VOICE_PICKED;
    u.rate=0.95; u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeak(){ try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} }
function speakWait(text){
  return new Promise(res=>{
    stopSpeak();
    text=cleanSpeech(text);
    if(!VOICE_ON||!text){ res(); return; }
    (async()=>{
      try{
        if(!("speechSynthesis" in window)){ res(); return; }
        await wait(120);
        if(!VOICE_PICKED) VOICE_PICKED=pickVoice();
        const u=new SpeechSynthesisUtterance(text);
        if(VOICE_PICKED) u.voice=VOICE_PICKED;
        u.rate=0.95; u.pitch=1.05;
        let done=false;
        const fin=()=>{ if(!done){ done=true; res(); } };
        u.onend=fin; u.onerror=fin;
        setTimeout(fin,15000);
        speechSynthesis.speak(u);
      }catch(e){ res(); }
    })();
  });
}
function toggleVoice(){
  VOICE_ON=!VOICE_ON;
  try{ localStorage.setItem(LS_VOICE, VOICE_ON?"1":"0"); }catch(e){}
  if(!VOICE_ON) stopSpeak();
  const b=document.getElementById("voicebtn"); if(b) b.textContent=VOICE_ON?"🔊":"🔇";
}
try{ if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged=function(){ VOICE_PICKED=null; }; } }catch(e){}
function render(screen, arg){

    parent:renderParent}[screen]||renderGate)(arg);
}

/* ============================ 3D. BOOT =================================== */
async function boot(){
  if(!CONFIG_OK){ renderSetupNeeded(); return; }
  if(typeof firebase==="undefined"){ renderNetError("Could not load the pieces of the app. Check your internet and reload."); return; }
  if(typeof Chess==="undefined"){ renderNetError("The chess rules did not load. Check your internet and reload."); return; }
  try{ if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
  let online=false;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    DB = firebase.database();
    watchConnection();
    await Promise.race([firebase.auth().signInAnonymously(), wait(7000).then(()=>{ throw new Error("auth timeout"); })]);
    online=true;
  }catch(e){ online=false; }
  const savedFam = localStorage.getItem(LS_FAM);
  if(savedFam){
    FAM = savedFam;
    if(online){
      const fam = await DB.ref("families/"+savedFam+"/meta").once("value").then(s=>s.val()).catch(()=>null);
      if(fam){ PINHASH=fam.parentPinHash||null; await loadProfiles(); saveCache(); flushOutbox(); return enterWithSavedProfile(); }
      localStorage.removeItem(LS_FAM); FAM=null;
    } else {
      const c = loadCache();
      if(c){ OFFLINE=true; PROFILES=c.profiles||{}; LPROG=c.progress||{}; PINHASH=c.pinHash||null; updateNetPill(); return enterWithSavedProfile(); }
      renderNetError("No internet right now, and this iPad hasn't saved your family yet. Connect to the internet once and open the app — after that, offline play will work on this iPad!"); return;
    }
  }
  if(!online){ renderNetError("Could not connect. Check your internet and reload."); return; }
  NAV=["gate"]; render("gate");
}

    fresh.map(c=>`<p style="margin:6px 0">${esc(c.text)}</p>
      <button class="btn ghost" style="font-size:15px;padding:10px 18px;min-height:44px" onclick="ackCoaching('${c.id}')">Got it!</button>`).join("") +
    `</div>`;
}
async function touchStreak(silent){
  try{
    const s = (await dbGet(`progress/${PROFILE.id}/streak`)) || {count:0,lastDay:""};
    const t = todayStr();
    if(s.lastDay !== t){
      const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
      s.count = (s.lastDay===y) ? (s.count||0)+1 : 1;
      s.lastDay = t;
      await dbSet(`progress/${PROFILE.id}/streak`, s);
      if(!silent && s.count>1) setTimeout(()=>toast(`🔥 ${s.count}-day streak! Keep it up!`), 800);
    }
    PROFILE._streak = s.count||1;
  }catch(e){ PROFILE._streak = 1; }
}

/* animated demo step: pieces slide by themselves while the story is read aloud.
   step = {t:"demo", text, fen, script:[{from,to,text,pause}]} */
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function sqCenter(el, sq){
  const s=el.querySelector('[data-sq="'+sq+'"]');
  const r=s.getBoundingClientRect(), w=el.getBoundingClientRect();
  return {x:r.left-w.left+r.width/2, y:r.top-w.top+r.height/2, size:r.width};
}
function animateMove(el, game, from, to){
  return new Promise(resolve=>{
    const piece=game.get(from);
    const finish=()=>{ game.move({from:from,to:to,promotion:"q"}); resolve(); };
    if(!piece){ finish(); return; }
    try{
      const c1=sqCenter(el,from), c2=sqCenter(el,to);
      const ghost=document.createElement("div");
      ghost.className="piece-ghost";
      ghost.style.width=ghost.style.height=(c1.size*0.92)+"px";
      ghost.style.left=(c1.x-c1.size*0.46)+"px";
      ghost.style.top=(c1.y-c1.size*0.46)+"px";
      ghost.innerHTML='<svg class="pcsvg" style="width:100%;height:100%"><use href="#p'+piece.color+piece.type+'" xlink:href="#p'+piece.color+piece.type+'"/></svg>';
      el.appendChild(ghost);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        ghost.style.transform="translate("+(c2.x-c1.x)+"px,"+(c2.y-c1.y)+"px)";
      }));
      setTimeout(()=>{ try{ghost.remove();}catch(e){} finish(); },620);
    }catch(e){ finish(); }
  });
}
async function playDemo(s){
  const g=new Chess(s.fen);
  const el=$("#lb"); if(!el) return;
  drawBoard(el, g, {interactive:false});
  await speakWait(s.text);
  for(const st of (s.script||[])){
    if(!document.body.contains(el)) return;
    const dt=$("#demotxt"); if(dt) dt.textContent=st.text||"";
    const sayP = st.text ? speakWait(st.text) : Promise.resolve();
    if(st.from&&st.to){
      drawBoard(el, g, {highlights:arrayToHl([st.from]), interactive:false});
      await wait(550);
      if(!document.body.contains(el)) return;
      await animateMove(el, g, st.from, st.to);
      if(!document.body.contains(el)) return;
      drawBoard(el, g, {highlights:arrayToHl([st.to]), interactive:false});
    }
    await sayP;
    await wait(st.pause||900);
  }
  if(!document.body.contains(el)) return;
  const nx=$("#demonext"); if(nx) nx.style.display="";
  const rp=$("#demoreplay"); if(rp) rp.style.display="";
}

/* lesson interactive move: tap `from`, then a target; fallback accepts any legal move if targets illegal */
function runLessonMove(s, L){
  const g = new Chess(s.fen);
  const el = $("#lb");
  let sel = null;
  const legalTargets = s.targets.filter(t => g.moves({square:s.from, verbose:true}).some(m=>m.to===t));
  const acceptAny = legalTargets.length===0;
  const targets = acceptAny ? g.moves({square:s.from, verbose:true}).map(m=>m.to) : legalTargets;
  function draw(){
    const dots = sel ? g.moves({square:sel, verbose:true}).map(m=>m.to) : [];
    const hl = {}; targets.forEach(t=>{ if(sel) hl[t]="hint"; });
    if(sel) hl[sel]="sel";
    drawBoard(el, g, {highlights:hl, dots, interactive:true, onTap(sq){
      if(!sel){
        const pc = g.get(sq);
        if(pc && pc.color===g.turn() && sq===s.from){ sel=sq; draw(); }
        else { $("#movefb").innerHTML=`<div class="feedback try">${tryAgain()} Tap the piece we are learning about.</div>`; }
      } else {
        const mv = g.moves({square:sel, verbose:true}).find(m=>m.to===sq);
        if(mv){
          if(targets.includes(sq) || acceptAny){
            g.move({from:sel,to:sq,promotion:"q"});
            drawBoard(el, g, {interactive:false});
            $("#movefb").innerHTML=`<div class="feedback good">${praise()} ${esc(s.after||"Well moved!")}</div>`;
            confetti(50); logActivity("practice", L.id+" move");
            setTimeout(()=>{LES.step++;render("lesson");},1600);
          } else {
            $("#movefb").innerHTML=`<div class="feedback try">Good thinking — that's a legal move too! Now try a <b>glowing</b> square. ✨</div>`;
            sel=null; draw();
          }
        } else { sel=null; draw(); }
      }
    }});
  }
  draw();
}

/* opts: {orientation:'w'|'b', highlights:{sq:'hint'|'good'|'sel'|'last'|'check'},

/* ---- rev 13: 3D view state for game boards (per-device, remembered) ---- */
const LS_VIEW="cla_view3d";
let VIEW3D={tilt:52, spin:0};
try{ const v=JSON.parse(localStorage.getItem(LS_VIEW)||"null"); if(v&&typeof v.tilt==="number"&&typeof v.spin==="number") VIEW3D=v; }catch(e){}

function setView(k, v){

  <label>Angle <input type="range" min="-60" max="60" value="${VIEW3D.spin}" oninput="setView('spin',this.value)" onchange="saveView()"></label></div>`;
}
function drawBoard(el, game, opts){
  opts = opts||{};
  el.innerHTML="";
  if(opts.stage){
    el.classList.add("board3d-on");
    el.style.setProperty("--tilt", VIEW3D.tilt+"deg");
    el.style.setProperty("--spin", VIEW3D.spin+"deg");
    const wrap=el.closest(".board-wrap"); if(wrap) wrap.classList.add("stage-wrap");
  } else {
    el.classList.remove("board3d-on");
    const wrap=el.closest(".board-wrap"); if(wrap) wrap.classList.remove("stage-wrap");
  }
  const orient = opts.orientation||"w";
  const b = game.board();
  for(let r=0;r<8;r++) for(let f=0;f<8;f++){
    const rr = orient==="w"? r : 7-r;
    const ff = orient==="w"? f : 7-f;
    const sq = "abcdefgh"[ff] + (8-rr);
    const piece = b[rr][ff];
    const d = document.createElement("div");
    d.className = "square " + (((rr+ff)%2===0)?"light":"dark");
    d.dataset.sq = sq;
    if(piece){
      const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
      s.setAttribute("class","pcsvg");
      const u=document.createElementNS("http://www.w3.org/2000/svg","use");
      u.setAttribute("href","#p"+piece.color+piece.type);
      u.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href","#p"+piece.color+piece.type);
      s.appendChild(u);
      if(opts.stage){
        const sh=document.createElement("div"); sh.className="pshadow"; d.appendChild(sh);
        const w=document.createElement("div"); w.className="pcw";
        const pv=document.createElement("div"); pv.className="pci"; pv.appendChild(s); w.appendChild(pv); d.appendChild(w);
      } else d.appendChild(s);
    }
    const hl = opts.highlights && opts.highlights[sq];
    if(hl==="hint") d.style.boxShadow="inset 0 0 0 5px rgba(127,182,245,.95)";
    else if(hl==="good") d.style.boxShadow="inset 0 0 0 5px rgba(111,207,151,.95)";
    else if(hl==="sel") d.classList.add("sel");
    else if(hl==="last") d.classList.add("lastmove");
    else if(hl==="check") d.classList.add("incheck");
    if(opts.dots && opts.dots.indexOf(sq)>=0){ const dot=document.createElement("div"); dot.className="dot"; d.appendChild(dot); }
    if(opts.caps && opts.caps.indexOf(sq)>=0){ const ring=document.createElement("div"); ring.className="cap-ring"; d.appendChild(ring); }
    if(opts.showCoords!==false){
      if(ff===0){ const c=document.createElement("span"); c.className="coord rank"; c.textContent=(8-rr); d.appendChild(c); }
      if(rr===7){ const c=document.createElement("span"); c.className="coord file"; c.textContent="abcdefgh"[ff]; d.appendChild(c); }
    }
    if(opts.interactive) d.addEventListener("click", ()=>opts.onTap(sq));
    el.appendChild(d);
  }
}
function kingInCheckSq(game){
  const turn = game.turn();
  for(let r=0;r<8;r++) for(let f=0;f<8;f++){
    const b=game.board()[r][f];
    if(b && b.type==="k" && b.color===turn) return "abcdefgh"[f]+(8-r);
  }
  return null;
}
function capturedTraysHTML(game){
  const hist = game.history({verbose:true});
  const wLost=[], bLost=[];
  hist.forEach(m=>{ if(m.captured){ (m.color==="w"?bLost:wLost).push(m.captured); } });
  const order={q:0,r:1,b:2,n:3,p:4};
  const g=(arr,color)=>arr.sort((a,b2)=>order[a]-order[b2]).map(t=>`<svg class="pcsvg" style="width:26px;height:26px"><use href="#p${color}${t}" xlink:href="#p${color}${t}"/></svg>`).join("");
  const score = materialScore(game);
  return `<div class="tray"><span class="muted" style="font-size:14px">You captured:</span> ${g(bLost,"b")} ${score>0?`<b>+${score}</b>`:""}</div>
          <div class="tray"><span class="muted" style="font-size:14px">Computer captured:</span> ${g(wLost,"w")} ${score<0?`<b>+${-score}</b>`:""}</div>`;
}
function materialScore(game){
  const V={p:1,n:3,b:3,r:5,q:9,k:0}; let s=0;
  game.board().forEach(row=>row.forEach(pc=>{ if(pc) s += (pc.color==="w"?1:-1)*V[pc.type]; }));
  return s;
}

const AI_NAMES={1:"Sleepy Sloth 🦥",2:"Bouncy Bunny 🐰",3:"Clever Fox 🦊",4:"Wise Owl 🦉",5:"Turbo Tiger 🐯"};
const AI_DEPTH={1:1,2:1,3:2,4:2,5:3};
const AI_RANDOM={1:0.35,2:0.12,3:0.03,4:0,5:0};
const AI_BLURB={1:"makes sleepy mistakes — you can beat me!",2:"learning, just like you!",3:"thinks a couple moves ahead!",4:"a real challenge!",5:"grandmaster training mode!"};
/* piece-square tables (white perspective, a8=0 … h1=63) */
const PST={
p:[0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],
n:[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],
b:[-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,10,10,5,0,-10,-10,5,5,10,10,5,5,-10,-10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,-10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20],
r:[0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],
q:[-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],
k:[-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20]};
const PCVAL={p:100,n:320,b:330,r:500,q:900,k:0};
function evaluate(g){
  let s=0; const b=g.board();
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const pc=b[r][f]; if(!pc)continue;
    const idx=pc.color==="w"?r*8+f:(7-r)*8+f;
    const v=PCVAL[pc.type]+PST[pc.type][idx];
    s+=pc.color==="w"?v:-v;
  }
  return s;
}
let NODES=0;
function orderMoves(g){
  const moves=g.moves({verbose:true});
  moves.forEach(m=>{ m._s=(m.captured?10*PCVAL[m.captured]-PCVAL[m.piece]:0)+(m.promotion?900:0); });
  moves.sort((a,b)=>b._s-a._s);
  return moves;
}
function alphabeta(g,depth,alpha,beta,maxing){
  if(++NODES>25000) return evaluate(g);
  if(depth===0||g.game_over()){
    if(g.in_checkmate()) return maxing?-100000:100000;
    if(g.in_draw()||g.in_stalemate()||g.in_threefold_repetition()||g.insufficient_material()) return 0;
    return evaluate(g);
  }
  const moves=orderMoves(g);
  if(maxing){ let best=-Infinity;
    for(const m of moves){ g.move({from:m.from,to:m.to,promotion:m.promotion}); const v=alphabeta(g,depth-1,alpha,beta,false); g.undo();
      if(v>best)best=v; if(best>alpha)alpha=best; if(alpha>=beta)break; }
    return best;
  } else { let best=Infinity;
    for(const m of moves){ g.move({from:m.from,to:m.to,promotion:m.promotion}); const v=alphabeta(g,depth-1,alpha,beta,true); g.undo();
      if(v<best)best=v; if(best<beta)beta=best; if(alpha>=beta)break; }
    return best;
  }
}
function aiBestMove(g,level){
  const moves=orderMoves(g);
  if(!moves.length) return null;
  if(Math.random()<AI_RANDOM[level]) return moves[Math.floor(Math.random()*moves.length)];
  const depth=AI_DEPTH[level], maxing=g.turn()==="w";
  NODES=0; let best=moves[0], bestV=maxing?-Infinity:Infinity;
  for(const m of moves){
    g.move({from:m.from,to:m.to,promotion:m.promotion});
    const v=alphabeta(g,depth-1,-Infinity,Infinity,!maxing);
    g.undo();
    const better = maxing ? v>bestV+ (level===4?Math.random()*8:0) : v<bestV-(level===4?Math.random()*8:0);
    if(better){ bestV=v; best=m; }
  }
  return best;
}

function canUndo(){

async function endComputerGame(){

/* ============================ 3P. NEARBY PLAY (WebRTC + QR handshake) =======
   Two iPads on the same Wi-Fi / hotspot, no internet needed: the connection
   invitation is swapped by QR code (offer one way, answer back), then moves
   flow over a WebRTC data channel. Results save through the normal store,
   so they queue on the iPad offline and sync later (rev 12 outbox). */
let NP=null;
const NP_PREFIX="CLA-NP1:";
function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64d(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4)s+="="; return decodeURIComponent(escape(atob(s))); }
function sdpPack(sdp){
  const grab=re=>{ const m=sdp.match(re); return m?m[1].trim():""; };
  const cands=[];
  sdp.split(/\r?\n/).forEach(l=>{ if(l.indexOf("a=candidate:")===0 && / typ host/.test(l)) cands.push(l.slice(2)); });
  return NP_PREFIX + b64e(JSON.stringify({u:grab(/a=ice-ufrag:(\S+)/), p:grab(/a=ice-pwd:(\S+)/),
    f:grab(/a=fingerprint:(\S+)/), s:grab(/a=setup:(\S+)/), c:cands}));
}
function sdpUnpack(txt){
  if(!txt || txt.indexOf(NP_PREFIX)!==0) return null;
  let o; try{ o=JSON.parse(b64d(txt.slice(NP_PREFIX.length))); }catch(e){ return null; }
  if(!o.u||!o.p||!o.f||!o.s||!Array.isArray(o.c)||!o.c.length) return null;
  const lines=["v=0","o=- 0 0 IN IP4 127.0.0.1","s=-","t=0 0","a=group:BUNDLE 0",
    "m=application 9 UDP/DTLS/SCTP webrtc-datachannel","c=IN IP4 0.0.0.0",
    "a=ice-ufrag:"+o.u,"a=ice-pwd:"+o.p,"a=fingerprint:"+o.f,"a=setup:"+o.s,"a=mid:0",
    "a=sctp-port:5000","a=max-message-size:262144"]
    .concat(o.c.map(c=>"a="+c)).concat(["a=end-of-candidates"]);
  return lines.join("\r\n")+"\r\n";
}
function waitIceComplete(pc){
  if(pc.iceGatheringState==="complete") return Promise.resolve();
  return new Promise(res=>{
    const to=setTimeout(done, 3500);
    function done(){ try{pc.removeEventListener("icegatheringstatechange", chk);}catch(e){} clearTimeout(to); res(); }
    function chk(){ if(pc.iceGatheringState==="complete") done(); }
    pc.addEventListener("icegatheringstatechange", chk);
  });
}
function qrSVG(txt){
  const qr=qrcode(0,"L"); qr.addData(txt); qr.make();
  return qr.createSvgTag({cellSize:5, margin:10, scalable:true});
}
let SCAN=null;
function stopScan(){
  if(!SCAN) return;
  SCAN.dead=true;
  if(SCAN.raf) cancelAnimationFrame(SCAN.raf);
  try{ SCAN.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  SCAN=null;
}
async function startScan(videoId, canvasId, onCode){
  stopScan();
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false}); }
  catch(e){ toast("Camera won't open — nearby play needs the camera to scan the code."); return false; }
  const video=document.getElementById(videoId), canvas=document.getElementById(canvasId);
  if(!video||!canvas){ try{stream.getTracks().forEach(t=>t.stop());}catch(e){} return false; }
  video.srcObject=stream; video.muted=true;
  await video.play().catch(()=>{});
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  SCAN={stream, raf:0, dead:false, last:0};
  const tick=()=>{
    if(!SCAN||SCAN.dead) return;
    const now=Date.now();
    if(now-SCAN.last>=130 && video.readyState>=2 && video.videoWidth){
      SCAN.last=now;
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      try{
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const res=jsQR(img.data, img.width, img.height, {inversionAttempts:"dontInvert"});
        if(res && res.data && res.data.indexOf(NP_PREFIX)===0){ const txt=res.data; stopScan(); onCode(txt); return; }
      }catch(e){}
    }
    if(SCAN) SCAN.raf=requestAnimationFrame(tick);
  };
  SCAN.raf=requestAnimationFrame(tick);
  return true;
}
function closeNearby(){
  stopScan();
  if(!NP) return;
  try{ if(NP.dc) NP.dc.close(); }catch(e){}
  try{ if(NP.pc) NP.pc.close(); }catch(e){}
  NP=null;
}
function nearbySend(o){ try{ if(NP&&NP.dc&&NP.dc.readyState==="open") NP.dc.send(JSON.stringify(o)); }catch(e){} }
function wireNearbyConn(){
  NP.pc.onconnectionstatechange=()=>{
    if(NP&&NP.pc&&(NP.pc.connectionState==="failed"||NP.pc.connectionState==="closed")&&NP.stage==="game"&&!NP.over){ NP.dead=true; drawNearbyBoard(); }
  };
}
function wireNearbyDc(){
  const dc=NP.dc; if(!dc) return;
  dc.onopen=()=>{ if(!NP) return; NP.helloSent=true; nearbySend({t:"hello",name:PROFILE.name,pid:PROFILE.id}); maybeStartNearby(); };
  dc.onmessage=e=>{ let m; try{m=JSON.parse(e.data);}catch(err){return;} nearbyOnMsg(m); };
  dc.onclose=()=>{ if(NP&&NP.stage==="game"&&!NP.over){ NP.dead=true; drawNearbyBoard(); } };
}
function maybeStartNearby(){
  if(!NP||NP.stage==="game"||NP.stage==="over") return;
  if(NP.helloSent&&NP.helloGot){ NP.stage="game"; drawNearbyBoard(); }
}
function nearbyInit(role){
  closeNearby();
  NP={role, color:role==="host"?"w":"b", game:new Chess(), sel:null, over:false, stage:"setup",
      oppName:"Opponent", oppPid:null, lastMove:null, movesList:[], recorded:false, dead:false,
      helloSent:false, helloGot:false, pc:null, dc:null};
  NAV.push("nearby");
  LIVE_UNSUBS.push(()=>closeNearby());
}
async function nearbyStart(){
  nearbyInit("host");
  view.innerHTML=topbar("Nearby play")+`<div class="card butter center"><h2>Setting up…</h2><p class="muted">Making your invitation code…</p></div>`;
  try{
    NP.pc=new RTCPeerConnection({iceServers:[]});
    NP.dc=NP.pc.createDataChannel("moves");
    wireNearbyDc(); wireNearbyConn();
    await NP.pc.setLocalDescription(await NP.pc.createOffer());
    await waitIceComplete(NP.pc);
    if(!NP||!NP.pc) return;
    NP.stage="offer";
    view.innerHTML=topbar("Nearby play")+`
    <div class="card butter center"><h2>📶 You are White ♔</h2>
    <p>On the other iPad: <b>Play family → Nearby play — join by scanning</b>, and point its camera at this code:</p>
    <div class="qrbox">${qrSVG(sdpPack(NP.pc.localDescription.sdp))}</div>
    <p class="muted">Both iPads must be on the same Wi-Fi or hotspot — no internet needed. Keep this code on screen; once the other iPad shows its reply code, tap Next.</p>
    <button class="btn primary big" onclick="nearbyHostScanAnswer()">Next: scan their reply code →</button>
    <button class="btn rose" onclick="nearbyCancel()">Cancel</button></div>`;
  }catch(e){ toast("Nearby play couldn't start on this iPad."); back(); }
}
function nearbyHostScanAnswer(){
  if(!NP||!NP.pc) return;
  NP.stage="scan-answer";
  view.innerHTML=topbar("Nearby play")+`
  <div class="card butter center"><h2>📷 Scan their reply code</h2>
  <video id="npscan" class="scanvideo" autoplay playsinline muted></video><canvas id="npscan-c" style="display:none"></canvas>
  <p class="muted">Point the camera at the reply code on the other iPad.</p>
  <button class="btn rose" onclick="nearbyCancel()">Cancel</button></div>`;
  startScan("npscan","npscan-c", async txt=>{
    if(!NP||!NP.pc) return;
    const sdp=sdpUnpack(txt);
    if(!sdp){ toast("That code didn't work — try again!"); nearbyHostScanAnswer(); return; }
    try{
      await NP.pc.setRemoteDescription({type:"answer", sdp});
      view.innerHTML=topbar("Nearby play")+`<div class="card butter center"><h2>Connecting… 📶</h2><p class="muted">Shaking hands with the other iPad — the game starts by itself!</p>

async function nearbyJoin(){

  view.innerHTML=topbar("Nearby play")+`
  <div class="card sky center"><h2>📷 Scan the other iPad's code</h2>
  <video id="npscan" class="scanvideo" autoplay playsinline muted></video><canvas id="npscan-c" style="display:none"></canvas>
  <p class="muted">The other iPad taps <b>Nearby play — start</b> and shows a code. Point this camera at it.</p>
  <button class="btn rose" onclick="nearbyCancel()">Cancel</button></div>`;

async function nearbyGuestGotOffer(txt){
  if(!NP) return;
  const sdp=sdpUnpack(txt);
  if(!sdp){ toast("That code didn't work — try again!"); nearbyJoin(); return; }
  view.innerHTML=topbar("Nearby play")+`<div class="card sky center"><h2>Got it! 🎉</h2><p class="muted">Making your reply code…</p></div>`;
  try{
    NP.pc=new RTCPeerConnection({iceServers:[]});
    NP.pc.ondatachannel=e=>{ if(!NP) return; NP.dc=e.channel; wireNearbyDc(); };
    wireNearbyConn();
    await NP.pc.setRemoteDescription({type:"offer", sdp});
    await NP.pc.setLocalDescription(await NP.pc.createAnswer());
    await waitIceComplete(NP.pc);
    if(!NP||!NP.pc) return;
    NP.stage="answer";
    view.innerHTML=topbar("Nearby play")+`
    <div class="card sky center"><h2>📶 You are Black ♚</h2>
    <p>Now show this code to the other iPad — it taps <b>Next</b> and scans it to finish connecting:</p>
    <div class="qrbox">${qrSVG(sdpPack(NP.pc.localDescription.sdp))}</div>
    <p class="muted">Keep this on screen — the game starts by itself once you're connected!</p>
    <button class="btn rose" onclick="nearbyCancel()">Cancel</button></div>`;
  }catch(e){ toast("Couldn't build the reply code."); back(); }
}
function nearbyCancel(){ back(); }
function nearbyOnMsg(m){
  if(!NP) return;
  if(m.t==="hello"){ NP.oppName=m.name||"Opponent"; NP.oppPid=m.pid||null; NP.helloGot=true; maybeStartNearby(); if(NP.stage==="game") drawNearbyBoard(); return; }
  if(NP.stage!=="game"||NP.over) return;
  if(m.t==="move"){
    const g=NP.game;
    const res=g.move({from:m.from,to:m.to,promotion:m.promotion||"q"});
    if(!res){ nearbySend({t:"sync-req"}); return; }
    NP.movesList.push(res.san);
    NP.lastMove={from:res.from,to:res.to}; NP.sel=null;
    if(g.game_over()){ finishNearby(g.in_checkmate()?(g.turn()==="w"?"b":"w"):"draw", false); return; }
    drawNearbyBoard(); return;
  }
  if(m.t==="sync-req"){ nearbySend({t:"sync", sans:NP.game.history()}); return; }
  if(m.t==="sync"){
    const g=new Chess(); let ok=true;
    (m.sans||[]).forEach(s=>{ if(!g.move(s)) ok=false; });
    if(ok){ NP.game=g; NP.movesList=g.history();
      const h=g.history({verbose:true}); const last=h[h.length-1];
      NP.lastMove=last?{from:last.from,to:last.to}:null; NP.sel=null; drawNearbyBoard(); }
    return;
  }
  if(m.t==="resign"){ finishNearby(NP.color, false); return; }
}
async function finishNearby(winner, recordIt){
  if(!NP||NP.over) return;
  NP.over=true; NP.stage="over"; NP.winner=winner;
  if(winner===NP.color){ try{ addXP(15); }catch(e){} confetti(100); }
  if(recordIt && !NP.recorded){
    NP.recorded=true;
    const whitePid=NP.color==="w"?PROFILE.id:NP.oppPid, blackPid=NP.color==="b"?PROFILE.id:NP.oppPid;
    if(whitePid&&blackPid&&whitePid!==blackPid){
      await dbPush("games",{type:"vs-kid",profileIds:[whitePid,blackPid],
        result:winner==="draw"?"draw":(winner==="w"?"white-wins":"black-wins"),
        winnerPid:winner==="draw"?null:(winner==="w"?whitePid:blackPid),
        moveCount:NP.movesList.length,createdAt:Date.now(),via:"nearby"});
    }
    await logActivity("livegame",`nearby finished: ${winner}`);
  }
  drawNearbyBoard();
}
function nearbyResign(){
  if(!NP||NP.over||NP.stage!=="game") return;
  if(!confirm("Resign this game? Your opponent will win — tap Cancel to keep playing!")) return;
  nearbySend({t:"resign"});
  finishNearby(NP.color==="w"?"b":"w", true);
}
function drawNearbyBoard(){
  if(!NP) return;
  const g=NP.game, myColor=NP.color;
  const myTurn=!NP.over && !NP.dead && g.turn()===myColor;
  const hl={};
  if(NP.lastMove){ hl[NP.lastMove.from]="last"; hl[NP.lastMove.to]="last"; }
  if(g.in_check()){ const k=kingInCheckSq(g); if(k) hl[k]="check"; }
  let dots=[],caps=[];
  if(NP.sel&&myTurn){ const mv=g.moves({square:NP.sel,verbose:true}); dots=mv.filter(m=>!m.captured).map(m=>m.to); caps=mv.filter(m=>m.captured).map(m=>m.to); hl[NP.sel]="sel"; }
  let banner="";
  if(NP.over){
    if(NP.winner==="draw") banner=`<div class="feedback good" style="text-align:center;font-size:20px">Draw! Well played, both of you! 🤝</div>`;
    else if(NP.winner===myColor) banner=`<div class="feedback good" style="text-align:center;font-size:20px">You win! 🏆 ${praise()}</div>`;
    else banner=`<div class="feedback good" style="text-align:center;font-size:20px">${esc(NP.oppName)} wins — good game! 💪</div>`;
    if(g.in_checkmate()) banner+=`<p class="muted center">👀 Look at the board: the king is in check and has NO escape — that's checkmate!</p>`;
    if(NP.oppPid) banner+=`<p class="muted center">💾 Result saved${OFFLINE?" on this iPad — it will sync when you're back online":""}!</p>`;
  } else if(NP.dead){
    banner=`<div class="feedback try" style="text-align:center">📴 The connection to the other iPad was lost, so this game can't continue. Start a new nearby game when you're ready!</div>`;
  }
  view.innerHTML=topbar(`vs ${esc(NP.oppName)}`)+`
  <div class="card"><p class="center muted">📶 Nearby game · You are <b>${myColor==="w"?"White ♔":"Black ♚"}</b>${NP.over||NP.dead?"":(myTurn?" · <b>Your move!</b>":" · "+esc(NP.oppName)+" is thinking…")}</p>
  ${banner}
  <div class="board-wrap"><div class="board" id="npb"></div></div>
  ${viewControlsHTML()}
  <div class="movelist" id="nml"></div>
  <div class="center">${NP.over||NP.dead
    ?`<button class="btn primary" onclick="render('live')">↻ New family game</button> <button class="btn ghost" onclick="NAV=['home'];render('home')">Home</button>`
    :`<button class="btn rose" onclick="nearbyResign()">🏳️ Resign</button> <button class="btn ghost" onclick="back()">Leave</button>`}</div></div>`;
  const h=g.history(); let html="<table>";
  for(let i=0;i<h.length;i+=2) html+=`<tr><td class="muted">${i/2+1}.</td><td><b>${esc(h[i])}</b></td><td>${esc(h[i+1]||"")}</td></tr>`;
  const ml=$("#nml"); if(ml){ ml.innerHTML=html+"</table>"; ml.scrollTop=ml.scrollHeight; }
  const el=$("#npb"); if(!el) return;
  drawBoard(el,g,{stage:true,orientation:myColor,highlights:hl,dots,caps,interactive:myTurn,onTap:async sq=>{
    if(!NP||!myTurn||NP.over||NP.dead) return;
    if(!NP.sel){ const pc=g.get(sq); if(pc&&pc.color===g.turn()){ NP.sel=sq; drawNearbyBoard(); } return; }
    if(sq===NP.sel){ NP.sel=null; drawNearbyBoard(); return; }
    const mv=g.moves({square:NP.sel,verbose:true}).find(m=>m.to===sq);
    if(!mv){ const pc=g.get(sq); NP.sel=(pc&&pc.color===g.turn())?sq:null; drawNearbyBoard(); return; }
    let promo=null; if(mv.promotion) promo=await promoPicker();
    const res=g.move({from:mv.from,to:mv.to,promotion:promo||"q"});
    NP.sel=null; NP.lastMove={from:res.from,to:res.to};
    NP.movesList.push(res.san);
    nearbySend({t:"move",from:res.from,to:res.to,promotion:res.promotion||null,san:res.san});
    if(g.game_over()){ finishNearby(g.in_checkmate()?(g.turn()==="w"?"b":"w"):"draw", true); return; }
    drawNearbyBoard();
  }});
}

/* ---- pass-and-play ---- */
let PP=null;
let PPSET=null;
function ppName(pid, fallback){ return pid&&PROFILES[pid]?PROFILES[pid].name:fallback; }
function startPassPlay(){
  const others=Object.keys(PROFILES).filter(id=>id!==PROFILE.id);
  const sib=others.find(id=>PROFILES[id].role==="kid")||others[0]||"guest";
  PPSET={w:PROFILE.id, b:sib};
  NAV.push("passplay"); drawPPSetup();
}
function drawPPSetup(){
  const chip=(side,id,label)=>`<button class="diff-btn ${PPSET[side]===id?"sel":""}" onclick="ppPick('${side}','${id}')">${label}</button>`;
  const row=side=>Object.entries(PROFILES).map(([id,p])=>chip(side,id,`${avatarHTML(p,26)} ${esc(p.name)}`)).join("")+chip(side,"guest","👤 Guest");
  const both=PPSET.w!=="guest"&&PPSET.b!=="guest"&&PPSET.w!==PPSET.b;
  view.innerHTML=topbar("Pass-and-play")+`
  <div class="card mint center"><div class="big-emoji">📱</div><h2>Who's playing?</h2>
  <p class="muted">Two players, one iPad — pass it back and forth after every move.${OFFLINE?" You're offline: the result saves on this iPad and syncs later!":""}</p></div>
  <div class="card"><h3>♔ White</h3><div class="diff-pick">${row("w")}</div>
  <h3>♚ Black</h3><div class="diff-pick">${row("b")}</div>
  <p class="center muted">${both?`✅ This game will be saved for <b>${esc(ppName(PPSET.w,""))}</b> and <b>${esc(ppName(PPSET.b,""))}</b>.`:"Pick two different players (not Guest) and the result will be saved for both!"}</p>
  <button class="btn primary big" onclick="ppBegin()">▶ Start game</button></div>`;
}
function ppPick(side,id){ PPSET[side]=id; drawPPSetup(); }
function ppBegin(){
  PP={game:new Chess(),sel:null,lastMove:null,over:false,moves:0,logged:false,winner:null,
      whitePid:PPSET.w==="guest"?null:PPSET.w, blackPid:PPSET.b==="guest"?null:PPSET.b};
  drawPassPlay();
}
function renderPassPlayAlias(){ if(PP) drawPassPlay(); else drawPPSetup(); }
function drawPassPlay(){
  const g=PP.game;
  const wn=ppName(PP.whitePid,"White"), bn=ppName(PP.blackPid,"Black");
  let banner="";
  if(PP.over){
    if(PP.winner==="draw") banner=`<div class="feedback good" style="text-align:center;font-size:20px">Draw! Well played, ${esc(wn)} and ${esc(bn)}! 🤝</div>`;
    else banner=`<div class="feedback good" style="text-align:center;font-size:20px">Checkmate! ${esc(PP.winner==="w"?wn:bn)} wins! 🏆</div>`;
    if(g.in_checkmate()) banner+=`<p class="muted center">👀 Look at the board: the king is in check and has NO escape — that's checkmate!</p>`;
    if(PP.whitePid&&PP.blackPid) banner+=`<p class="muted center">💾 Result saved${OFFLINE?" on this iPad — it will sync when you're back online":""}!</p>`;
  }
  view.innerHTML=topbar("Pass-and-play")+`
  <div class="card mint"><p class="center"><b>${esc(wn)}</b> ♔ vs <b>${esc(bn)}</b> ♚</p>
  ${PP.over?banner:`<p class="center"><b>${g.turn()==="w"?esc(wn):esc(bn)}</b> to move — pass the iPad! 📱</p>`}
  <div class="board-wrap"><div class="board" id="ppb"></div></div>
  ${viewControlsHTML()}
  <div class="center">${PP.over
    ?`<button class="btn primary" onclick="startPassPlay()">↻ Play again</button> <button class="btn ghost" onclick="NAV=['home'];render('home')">Home</button>`
    :`<button class="btn ghost" onclick="back()">End game</button>`}</div></div>`;
  const el=$("#ppb"); const hl={};
  if(PP.lastMove){hl[PP.lastMove.from]="last";hl[PP.lastMove.to]="last";}
  if(g.in_check()){const k=kingInCheckSq(g);if(k)hl[k]="check";}
  let dots=[],caps=[];
  if(PP.sel){const mv=g.moves({square:PP.sel,verbose:true});dots=mv.filter(m=>!m.captured).map(m=>m.to);caps=mv.filter(m=>m.captured).map(m=>m.to);hl[PP.sel]="sel";}
  drawBoard(el,g,{stage:true,highlights:hl,dots,caps,interactive:!PP.over,onTap:async sq=>{
    if(PP.over)return;
    if(!PP.sel){const pc=g.get(sq);if(pc&&pc.color===g.turn()){PP.sel=sq;drawPassPlay();}return;}
    if(sq===PP.sel){PP.sel=null;drawPassPlay();return;}
    const mv=g.moves({square:PP.sel,verbose:true}).find(m=>m.to===sq);
    if(!mv){const pc=g.get(sq);PP.sel=(pc&&pc.color===g.turn())?sq:null;drawPassPlay();return;}
    let promo=null; if(mv.promotion)promo=await promoPicker();
    const res=g.move({from:mv.from,to:mv.to,promotion:promo||"q"});
    PP.sel=null;PP.lastMove={from:res.from,to:res.to};PP.moves++;
    if(g.game_over()){ finishPassPlay(); return; }
    drawPassPlay();
  }});
}
async function finishPassPlay(){
  if(PP.logged) return; PP.logged=true; PP.over=true;
  const g=PP.game;
  PP.winner=g.in_checkmate()?(g.turn()==="w"?"b":"w"):"draw";
  if(PP.winner!=="draw") confetti(80);
  if(PP.whitePid&&PP.blackPid&&PP.whitePid!==PP.blackPid){
    const w=PP.winner;
    await dbPush("games",{type:"vs-kid",profileIds:[PP.whitePid,PP.blackPid],
      result:w==="draw"?"draw":(w==="w"?"white-wins":"black-wins"),
      winnerPid:w==="draw"?null:(w==="w"?PP.whitePid:PP.blackPid),
      moveCount:PP.moves,createdAt:Date.now(),via:"pass-and-play"});
    if(w==="draw"){ addXP(5,PP.whitePid); addXP(5,PP.blackPid); }
    else addXP(15, w==="w"?PP.whitePid:PP.blackPid);
    logActivityFor(PP.whitePid,"game",`pass-and-play vs ${ppName(PP.blackPid,"Black")}: ${w==="draw"?"draw":(w==="w"?"won":"lost")} (${PP.moves} moves)`);
    logActivityFor(PP.blackPid,"game",`pass-and-play vs ${ppName(PP.whitePid,"White")}: ${w==="draw"?"draw":(w==="b"?"won":"lost")} (${PP.moves} moves)`);
  }
  drawPassPlay();
}

function startDemo(i){
  const g=DEMO_GAMES[i];
  DG={game:g, idx:i, ply:0, playing:false, run:0, finished:false};
  NAV.push("demo"); render("demo");
  LIVE_UNSUBS.push(()=>{ if(DG){ DG.playing=false; DG.run++; } stopSpeak(); });
  speak(g.intro);
}
function renderDemoSafe(){ if(DG) drawDemo(); else render("demos"); }
function drawDemo(){
  if(!DG)return;
  const gv=DG.game, total=gv.moves.length, ply=DG.ply;
  const g=new Chess(); let last=null;
  for(let k=0;k<ply;k++) last=g.move(gv.moves[k]);
  const hl={};
  if(last){ hl[last.from]="last"; hl[last.to]="last"; }
  if(g.in_check()){ const ksq=kingInCheckSq(g); if(ksq)hl[ksq]="check"; }
  const PIECES={p:"pawn",n:"knight",b:"bishop",r:"rook",q:"queen",k:"king"};
  let heading, note;
  if(ply===0){ heading="The starting position"; note=gv.intro; }
  else{
    const mvN=Math.floor((ply-1)/2)+1, side=(ply-1)%2===0?"White":"Black";
    heading=`Move ${mvN} · ${side} plays ${gv.moves[ply-1]}`;
    note=gv.notes[ply-1];
  }
  const atEnd=ply>=total;
  view.innerHTML=topbar(gv.emoji+" "+gv.title)+`
  <div class="card"><p class="center muted" style="margin-top:0">${esc(gv.who)}</p>
  <div class="board-wrap"><div class="board" id="demob"></div></div>
  <div class="progressbar"><div style="width:${Math.round(ply/total*100)}%"></div></div>
  <p class="center muted" style="margin:4px 0">Step ${ply} of ${total} · <b>${esc(gv.theme)}</b></p>
  <div id="demotxt"><h3 style="margin:6px 0">${esc(heading)}</h3><p style="font-size:18px;margin:6px 0">${esc(note)}</p></div>
  <div class="center" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <button class="btn ghost" onclick="demoJump(0)">⏮ Start</button>
    <button class="btn sky" onclick="demoStep(-1)" ${ply===0?'disabled style="opacity:.45"':""}>◀ Back</button>
    <button class="btn primary" onclick="demoTogglePlay()">${DG.playing?"⏸ Pause":"▶ Play all"}</button>
    <button class="btn sky" onclick="demoStep(1)" ${atEnd?'disabled style="opacity:.45"':""}>Next ▶</button>
  </div></div>
  ${atEnd?demoEndHTML():""}`;
  drawBoard($("#demob"), g, {highlights:hl, interactive:false});
  if(atEnd) onDemoEnd();
}
function demoEndHTML(){
  const gv=DG.game;
  return `<div class="card mint"><h3>🧠 What to remember</h3>
  ${gv.remember.map(r=>`<p style="font-size:17px;margin:8px 0">• ${esc(r)}</p>`).join("")}
  <div class="center"><button class="btn sky" onclick="demoJump(0)">↻ Watch again</button>
  <button class="btn primary" onclick="back()">All games</button></div></div>`;
}
async function onDemoEnd(){
  if(!DG||DG.finished)return; DG.finished=true;
  confetti(60);
  const gv=DG.game;
  let prev=null;
  try{ prev=await dbGet(`progress/${PROFILE.id}/demos/${gv.id}`); }catch(e){}
  if(!prev||!prev.completed){
    try{ await dbSet(`progress/${PROFILE.id}/demos/${gv.id}`,{completed:true,at:Date.now()}); }catch(e){}
    await addXP(10);
    toast("Game finished! +10 XP 🎬");
  }
  await logActivity("demo",`watched ${gv.title}`);
}
function demoStep(d){
  if(!DG)return;
  DG.playing=false; DG.run++;
  const total=DG.game.moves.length;
  DG.ply=Math.max(0,Math.min(total,DG.ply+d));
  drawDemo();
  speak(DG.ply===0?DG.game.intro:DG.game.notes[DG.ply-1]);
}
function demoJump(p){
  if(!DG)return;
  DG.playing=false; DG.run++;
  DG.ply=p;
  drawDemo();
  speak(p===0?DG.game.intro:DG.game.notes[p-1]);
}
function demoTogglePlay(){
  if(!DG)return;
  if(DG.playing){ DG.playing=false; DG.run++; stopSpeak(); drawDemo(); return; }
  if(DG.ply>=DG.game.moves.length) DG.ply=0;
  DG.playing=true; DG.run++;
  drawDemo();
  demoAutoLoop(DG.run);
}
async function demoAutoLoop(run){
  while(DG&&DG.playing&&DG.run===run){
    const total=DG.game.moves.length;
    if(DG.ply>=total){ DG.playing=false; drawDemo(); return; }
    DG.ply++;
    drawDemo();
    const t0=Date.now();
    await speakWait(DG.game.notes[DG.ply-1]);
    if(!DG||!DG.playing||DG.run!==run) return;
    const el=Date.now()-t0;
    if(el<2600) await wait(2600-el);
  }
}


/* ============================ 3N3. TIC-TAC-TOE ========================= */

const TTT_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let TT=null;
function tttWinner(b){
  for(const L of TTT_LINES){ if(b[L[0]]&&b[L[0]]===b[L[1]]&&b[L[1]]===b[L[2]]) return {who:b[L[0]],line:L}; }
  if(b.every(c=>c)) return {who:"draw",line:null};
  return null;
}
function normTTTBoard(b){ return Array.from({length:9},(_,i)=>(b&&b[i])||""); }
function tttFindWin(b,who){
  for(let i=0;i<9;i++){ if(!b[i]){ b[i]=who; const w=tttWinner(b); b[i]=""; if(w&&w.who===who) return i; } }
  return -1;
}
function tttBestMove(b,me,opp){
  function mm(board,turn,depth){
    const w=tttWinner(board);
    if(w){ if(w.who===me)return 10-depth; if(w.who===opp)return depth-10; return 0; }
    const isMax=turn===me; let best=isMax?-Infinity:Infinity;
    for(let i=0;i<9;i++){ if(!board[i]){ board[i]=turn; const v=mm(board,turn===me?opp:me,depth+1); board[i]=""; best=isMax?Math.max(best,v):Math.min(best,v); } }
    return best;
  }
  let bestIdx=-1,bestVal=-Infinity;
  for(let i=0;i<9;i++){ if(!b[i]){ b[i]=me; const v=mm(b,opp,0); b[i]=""; if(v>bestVal){bestVal=v;bestIdx=i;} } }
  return bestIdx;
}
function tttCpuMove(b,level){
  const empties=[...Array(9).keys()].filter(i=>!b[i]);
  if(!empties.length)return -1;
  if(level>=3) return tttBestMove(b,"O","X");
  if(level===2){
    let i=tttFindWin(b,"O"); if(i>=0)return i;
    i=tttFindWin(b,"X"); if(i>=0)return i;
    if(!b[4])return 4;
    const corners=[0,2,6,8].filter(x=>!b[x]);
    if(corners.length&&Math.random()<0.8) return corners[Math.floor(Math.random()*corners.length)];
  }
  return empties[Math.floor(Math.random()*empties.length)];
}

    .sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0));
  if(!mine.length){box.innerHTML="";return;}
  const nameOf=id=>(profs&&profs[id]&&profs[id].name)||"Opponent";
  box.innerHTML=`<div class="card sky"><h3>🎮 Your games in progress</h3>`+mine.map(([code,g])=>{

}
async function resumeTTT(code){
  const d=await dbGet(`tttGames/${code}`);
  if(!d){toast("That game is gone.");renderTTTHub();return;}
  if(d.x!==PROFILE.id&&d.o!==PROFILE.id){toast("That game belongs to other players.");return;}
  if(d.status==="finished"){toast("That game already ended.");renderTTTHub();return;}
  await logActivity("ttt",`resumed ${code}`);
  enterTTTGame(code);
}
async function dropTTT(code){
  if(!confirm("Remove this game? It will be gone for both players, and nobody wins."))return;
  try{await ref(`tttGames/${code}`).remove();}catch(e){}
  await logActivity("ttt",`removed unfinished game ${code}`);
  renderTTTHub();
}
function startTTTCpu(level){
  TT={mode:"cpu",level,board:Array(9).fill(""),turn:"X",over:false,winInfo:null,thinking:false,score:{you:0,cpu:0,draws:0}};
  NAV.push("tttgame"); drawTTT();
}
function startTTTPass(){
  TT={mode:"pass",board:Array(9).fill(""),turn:"X",over:false,winInfo:null};
  NAV.push("tttgame"); drawTTT();
}
function renderTTTSafe(){ if(TT) drawTTT(); else render("ttt"); }
function tttCellsHTML(board,winLine){
  return `<div class="ttt-grid">${board.map((c,i)=>`<button class="ttt-cell${winLine&&winLine.indexOf(i)>=0?" win":""}" onclick="tttTap(${i})">${c==="X"?"❌":c==="O"?"⭕":""}</button>`).join("")}</div>`;
}
function drawTTT(){
  if(!TT)return;
  let title="Tic-Tac-Toe", status="", board, winLine=null, buttons="";
  if(TT.mode==="cpu"){
    board=TT.board; winLine=TT.winInfo?TT.winInfo.line:null;
    const sc=TT.score;
    if(TT.over){
      status=TT.winInfo.who==="X"?`<b>${praise()} You win! 🎉</b>`:TT.winInfo.who==="draw"?"<b>It's a draw! 🤝</b>":"<b>The computer wins this one — try again! 💪</b>";
    } else status=TT.thinking?"Computer is thinking…":"<b>Your move — you are ❌</b>";
    buttons=`${TT.over?`<button class="btn primary big" onclick="tttAgain()">▶ Play again</button>`:""}
    <button class="btn ghost big" onclick="back()">Done</button>
    <p class="muted center">You ${sc.you} · Computer ${sc.cpu} · Draws ${sc.draws} · Level: ${["","😊 Easy","🙂 Medium","🧠 Hard"][TT.level]}</p>`;
    view.innerHTML=topbar(title)+`<div class="card center"><p style="font-size:19px">${status}</p>${tttCellsHTML(board,winLine)}${buttons}</div>`;
  } else if(TT.mode==="pass"){
    board=TT.board; winLine=TT.winInfo?TT.winInfo.line:null;
    if(TT.over){
      status=TT.winInfo.who==="draw"?"<b>It's a draw! 🤝</b>":`<b>${TT.winInfo.who==="X"?"❌":"⭕"} wins! 🎉</b>`;
    } else status=`<b>${TT.turn==="X"?"❌":"⭕"} to move</b> — pass the iPad! 📱`;
    buttons=`${TT.over?`<button class="btn primary big" onclick="tttAgain()">▶ Play again</button>`:""}
    <button class="btn ghost big" onclick="back()">Done</button>`;
    view.innerHTML=topbar(title)+`<div class="card center"><p style="font-size:19px">${status}</p>${tttCellsHTML(board,winLine)}${buttons}</div>`;
  } else if(TT.mode==="live"){
    const d=TT.data;
    if(!d){ view.innerHTML=topbar(title)+`<div class="card center"><p>Loading game…</p></div>`; return; }
    board=normTTTBoard(d.board);
    const w=tttWinner(board); winLine=w?w.line:null;
    const mySym=d.x===PROFILE.id?"X":"O";
    title=`vs ${esc(TT.oppName||"Opponent")}`;
    if(d.status==="waiting") status="Waiting for your opponent to join…";
    else if(d.winner) status=d.winner==="draw"?"<b>It's a draw! 🤝</b>":(d.winner===mySym?"<b>🎉 You win!</b>":`<b>${esc(TT.oppName||"Opponent")} wins this one!</b>`);
    else status=myTTTTurn()?`<b>Your move — you are ${mySym==="X"?"❌":"⭕"}</b>`:`${esc(TT.oppName||"Opponent")} is thinking…`;
    buttons=d.winner
      ?`<button class="btn primary big" onclick="tttRematch()">▶ Play again</button><button class="btn ghost big" onclick="leaveTTT()">Done</button>`
      :`<button class="btn ghost big" onclick="leaveTTT()">Leave (finish later)</button>`;
    view.innerHTML=topbar(title)+`<div class="card center"><p style="font-size:19px">${status}</p>${tttCellsHTML(board,winLine)}${buttons}</div>`;
  }
}
function tttEndCpu(){
  const w=tttWinner(TT.board);
  if(!w)return false;
  TT.over=true; TT.winInfo=w;
  if(w.who==="X"){ TT.score.you++; addXP(5); confetti(70); logActivity("ttt",`beat the computer (level ${TT.level})`); }
  else if(w.who==="O"){ TT.score.cpu++; logActivity("ttt",`lost to the computer (level ${TT.level})`); }
  else { TT.score.draws++; logActivity("ttt",`drew the computer (level ${TT.level})`); }
  return true;
}
function tttAgain(){
  if(!TT)return;
  if(TT.mode==="cpu"){ TT.board=Array(9).fill(""); TT.turn="X"; TT.over=false; TT.winInfo=null; TT.thinking=false; }
  else if(TT.mode==="pass"){ TT.board=Array(9).fill(""); TT.turn="X"; TT.over=false; TT.winInfo=null; }
  drawTTT();
}
async function tttTap(i){
  if(!TT)return;
  if(TT.mode==="cpu"){
    if(TT.over||TT.thinking||TT.turn!=="X"||TT.board[i])return;
    TT.board[i]="X"; TT.turn="O";
    if(tttEndCpu()){ drawTTT(); return; }
    drawTTT();
    TT.thinking=true;
    setTimeout(()=>{
      if(!TT||TT.mode!=="cpu"||TT.over)return;
      const mv=tttCpuMove(TT.board,TT.level);
      if(mv>=0)TT.board[mv]="O";
      TT.turn="X"; TT.thinking=false;
      tttEndCpu();
      drawTTT();
    },500);
  } else if(TT.mode==="pass"){
    if(TT.over||TT.board[i])return;
    TT.board[i]=TT.turn;
    const w=tttWinner(TT.board);
    if(w){ TT.over=true; TT.winInfo=w; if(w.who!=="draw")confetti(60); logActivity("ttt",`pass-and-play: ${w.who==="draw"?"draw":w.who+" won"}`); }
    else TT.turn=TT.turn==="X"?"O":"X";
    drawTTT();
  } else if(TT.mode==="live"){
    if(!myTTTTurn())return;
    const d=TT.data; const board=normTTTBoard(d.board);
    if(board[i])return;
    const mySym=d.x===PROFILE.id?"X":"O";
    board[i]=mySym;
    const w=tttWinner(board);
    const upd={board,turn:mySym==="X"?"O":"X",updatedAt:Date.now()};
    if(w){ upd.winner=w.who; upd.status="finished"; }
    await dbUpdate(`tttGames/${TT.code}`,upd);
  }
}
function myTTTTurn(){
  if(!TT||TT.mode!=="live"||!TT.data||TT.data.status!=="active")return false;
  const d=TT.data;
  return (d.x===PROFILE.id&&d.turn==="X")||(d.o===PROFILE.id&&d.turn==="O");
}
async function createTTTGame(){
  const code=rnd(4);
  await dbSet(`tttGames/${code}`,{status:"waiting",x:PROFILE.id,o:null,board:["","","","","","","","",""],turn:"X",winner:null,updatedAt:Date.now()});
  await logActivity("ttt",`created ${code}`);
  view.innerHTML=topbar("Waiting…")+`
  <div class="card butter center"><h2>Share this code!</h2>
  <div class="lobby-code">${code}</div>
  <p>On the other iPad: <b>Tic-Tac-Toe → Join with code</b><br>You play <b>❌</b> and go first</p>
  <p class="muted">Waiting for your opponent…</p>
  <button class="btn rose" onclick="cancelTTT('${code}')">Cancel</button></div>`;
  const cb=ref(`tttGames/${code}`).on("value",snap=>{
    const d=snap.val(); if(!d)return;
    if(d.status==="active"&&d.o){ enterTTTGame(code); }
  });
  LIVE_UNSUBS.push(()=>ref(`tttGames/${code}`).off("value",cb));
  TT={mode:"live",code,watching:true};
}
async function cancelTTT(code){ try{await ref(`tttGames/${code}`).remove();}catch(e){} back(); }
function joinTTTUI(){
  view.innerHTML=topbar("Join game")+`
  <div class="card sky center"><h2>Enter the game code</h2>
  <input type="text" id="tgcode" maxlength="4" placeholder="ABCD" autocomplete="off"
    style="text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:32px;font-family:ui-monospace,monospace;">
  <button class="btn primary big" onclick="doJoinTTT()">Join! ⭕</button></div>`;
}
async function doJoinTTT(){
  const code=(($("#tgcode").value||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,""));
  const d=await dbGet(`tttGames/${code}`);
  if(!d){toast("No game with that code. Check it and try again!");return;}
  if(d.status==="finished"){toast("That game already ended.");return;}
  if(d.x===PROFILE.id||d.o===PROFILE.id){ await logActivity("ttt",`resumed ${code} by code`); enterTTTGame(code); return; }
  if(d.status!=="waiting"){toast("That game already has two players.");return;}
  await dbUpdate(`tttGames/${code}`,{o:PROFILE.id,status:"active",updatedAt:Date.now()});
  await logActivity("ttt",`joined ${code}`);
  enterTTTGame(code);
}
async function enterTTTGame(code){
  LIVE_UNSUBS.forEach(u=>{try{u();}catch(e){}}); LIVE_UNSUBS=[];
  TT={mode:"live",code,data:null,done:false,oppName:"Opponent"};
  NAV.push("tttgame");
  const cb=ref(`tttGames/${code}`).on("value",async snap=>{
    const d=snap.val(); if(!d){ if(!TT.done){toast("Game closed.");back();} return; }
    TT.data=d;
    const mySym=d.x===PROFILE.id?"X":"O";
    const oppPid=mySym==="X"?d.o:d.x;
    if(oppPid&&TT.oppName==="Opponent"){
      const n=await dbGet(`profiles/${oppPid}/name`); if(n)TT.oppName=n;
    }
    if(d.winner&&!TT.done){ TT.done=true; onTTTLiveEnd(d,mySym); }
    if(!d.winner) TT.done=false;
    drawTTT();
  });
  LIVE_UNSUBS.push(()=>ref(`tttGames/${code}`).off("value",cb));
  drawTTT();
}
function onTTTLiveEnd(d,mySym){
  if(d.winner==="draw"){ logActivity("ttt",`family game ${TT.code}: draw`); }
  else if(d.winner===mySym){ addXP(10); confetti(80); logActivity("ttt",`family game ${TT.code}: won`); }
  else { logActivity("ttt",`family game ${TT.code}: lost`); }
}
async function tttRematch(){
  if(!TT||TT.mode!=="live"||!TT.data)return;
  const d=TT.data;
  TT.done=false;
  await dbUpdate(`tttGames/${TT.code}`,{board:["","","","","","","","",""],turn:"X",winner:null,status:"active",x:d.o,o:d.x,updatedAt:Date.now()});
  await logActivity("ttt",`rematch ${TT.code}`);
}
async function leaveTTT(){
  if(TT&&TT.mode==="live"&&TT.data&&TT.data.winner){
    try{await ref(`tttGames/${TT.code}`).remove();}catch(e){}
  }
  back();
}

  if(!PROFILE||PROFILE.role!=="parent"){ NAV=["profiles"]; render("profiles"); return; }
  const kids=Object.entries(PROFILES).filter(([,p])=>p.role!=="parent");
  view.innerHTML=topbar("Parent dashboard",false)+`
  <div class="card lavender"><h2>👋 Hi ${esc(PROFILE.name)}!</h2>
  <p class="muted">Here's how everyone is doing. Stella also sends you a summary every Sunday evening.</p>
  <div class="tabs">${kids.map(([id,p],i)=>`<button class="tab${i===0?" sel":""}" onclick="parentTab('${id}',this)">${avatarHTML(p,26)} ${esc(p.name)}</button>`).join("")}</div>
  <div id="ptab"></div>
  <div class="center" style="margin-top:10px"><button class="btn ghost" onclick="switchProfile()">Switch player</button></div></div>
  <div class="card mint" style="margin-top:12px"><h3>🎮 Play & learn as ${esc(PROFILE.name)}</h3>
  <p class="muted">Get your own lessons, puzzles and games — tutorials, play vs the computer, and family games, just like the kids have. Your progress stays separate under your name.</p>
  <div class="center"><button class="btn primary big" onclick="parentPlayMode()">Enter play mode →</button></div></div>
  <div class="card peach" style="margin-top:12px"><h3>🔑 Family code</h3>
  <p class="muted">On your other iPad, choose <b>Join with a family code</b> and type this in:</p>
  <div class="code-big">${esc(FAM||"")}</div>
  <div class="center" style="margin-top:10px"><button class="btn ghost" onclick="resetFamily()">Start over with a new family</button></div>
  <p class="muted center">Erases all profiles, progress and games, then starts fresh. Only use while setting up.</p></div>`;
  if(kids.length) parentTab(kids[0][0], $(".tab"));
}
/* Parent play mode: grown-ups get the full lessons + play experience under their own profile */
async function parentPlayMode(){
  if(!PROFILE||PROFILE.role!=="parent"){ NAV=["profiles"]; render("profiles"); return; }
  await loadCoaching();
  try{ await touchStreak(true); }catch(e){}
  NAV=["parent","home"]; render("home");
}
async function resetFamily(){
  if(!confirm("Start over? This erases ALL profiles, progress and games for this family.")) return;
  try{ if(FAM) await DB.ref("families/"+FAM).remove(); }catch(e){}
  try{ localStorage.removeItem(LS_FAM); }catch(e){}
  location.reload();
}
async function parentTab(pid,el){
  $$(".tab").forEach(t=>t.classList.remove("sel")); if(el)el.classList.add("sel");
  $("#ptab").innerHTML=`<p class="center muted">Loading ${esc(PROFILES[pid].name)}…</p>`;
  const [lessons,skill,puz,puzR,streak,badges,acts,coach,gamesSnap]=await Promise.all([
    dbGet(`progress/${pid}/lessons`),dbGet(`progress/${pid}/skill`),dbGet(`progress/${pid}/puzzles`),
    dbGet(`progress/${pid}/puzzleRating`),dbGet(`progress/${pid}/streak`),dbGet(`progress/${pid}/badges`),
    ref(`activities/${pid}`).limitToLast(8).once("value").then(s=>s.val()).catch(()=>null),
    dbGet(`coaching/${pid}/directives`),
    ref("games").limitToLast(60).once("value").then(s=>s.val()).catch(()=>null),
  ]);
  const lArr=lessons?Object.values(lessons):[];
  const done=lArr.filter(l=>l.completed).length;
  const stars=lArr.reduce((a,l)=>a+(l.stars||0),0);
  const qAvg=lArr.length?(lArr.reduce((a,l)=>a+(l.bestScore||0),0)/(lArr.length*3)*100):0;
  const pzArr=puz?Object.values(puz):[];
  const solved=pzArr.filter(p=>p.solved).length;
  const gArr=gamesSnap?Object.values(gamesSnap).filter(g=>(g.profileIds||[]).includes(pid)):[];
  const vsc=gArr.filter(g=>g.type==="vs-computer");
  const w=vsc.filter(g=>g.result==="win").length, l=vsc.filter(g=>g.result==="loss").length, d=vsc.filter(g=>g.result==="draw").length;
  const vsk=gArr.filter(g=>g.type==="vs-kid").length;
  const actArr=acts?Object.entries(acts).map(([id,a])=>a).sort((a,b)=>b.createdAt-a.createdAt):[];
  const coachArr=coach?Object.entries(coach).map(([id,c])=>Object.assign({id},c)).sort((a,b)=>b.createdAt-a.createdAt).slice(0,5):[];
  const ago=ts=>{const m=Math.floor((Date.now()-ts)/60000);return m<1?"just now":m<60?m+"m ago":Math.floor(m/60)+"h ago";};
  $("#ptab").innerHTML=`
  <div class="grid2">
    <div><div class="kv"><span>🎂 Age</span><b>${esc(String((PROFILES[pid]&&PROFILES[pid].age)||"—"))}</b></div>
    <div class="kv"><span>Level / XP</span><b>${(skill&&skill.level)||1} · ${(skill&&skill.xp)||0} XP</b></div>
    <div class="kv"><span>🔥 Streak</span><b>${(streak&&streak.count)||0} days</b></div>
    <div class="kv"><span>📚 Lessons</span><b>${done}/${LESSONS.length} · ${stars}★</b></div>
    <div class="kv"><span>📝 Quiz average</span><b>${Math.round(qAvg)}%</b></div></div>
    <div><div class="kv"><span>🧩 Puzzles</span><b>${solved} solved · rating ${puzR||400}</b></div>
    <div class="kv"><span>🤖 vs Computer</span><b>${w}W / ${l}L / ${d}D</b></div>
    <div class="kv"><span>👧🧒 vs Family</span><b>${vsk} games</b></div>
    <div class="kv"><span>🏅 Badges</span><b>${badges?Object.keys(badges).length:0}</b></div></div>
  </div>
  <h3>Recent activity</h3>
  ${actArr.length?actArr.map(a=>`<div class="kv"><span>${esc(a.type)} — ${esc(a.detail||"")}</span><span class="muted">${ago(a.createdAt)}</span></div>`).join(""):'<p class="muted">No activity yet.</p>'}
  <h3>Coaching log (Stella)</h3>
  ${coachArr.length?coachArr.map(c=>`<div class="kv"><span><b>${esc(c.kind)}</b> — ${esc(c.text)}</span><span class="muted">${ago(c.createdAt)}</span></div>`).join(""):'<p class="muted">No coaching notes yet.</p>'}`;
}

  startPassPlay,ppPick,ppBegin,nearbyStart,nearbyJoin,nearbyCancel,nearbyResign,nearbyHostScanAnswer,setView,saveView,parentTab,parentPlayMode,resetFamily,replayDemo,toggleVoice});
